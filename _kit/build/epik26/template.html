  return `<ul class="krlist">${ks.length ? ks.map(t=>{ const it = RELEASED.get(t); return `<li><span>${esc(t)}</span>${it?`<span class="ics"><button class="mini pv" data-play="${esc(t)}" aria-label="Play preview of ${esc(t)}">${playInner(t, true)}</button>${it.spotify?`<a class="mini" href="${esc(it.spotify)}" target="_blank" rel="noopener" aria-label="Open ${esc(t)} on Spotify">${IC.sp}</a>`:""}</span>`:""}</li>`; }).join("") : `<li class="none">no KR songs yet. tap the name to pick some.</li>`}</ul>`;
}
function renderCard(){
  const chosen = chosenSlots();
  const bad = clashes();
  const now = nowMin();
  const nextIdx = !TIMED || now===null ? -1 : chosen.findIndex(s => s.s > now);
  const third = TIMED ? `<div class="stat ${bad.size?"bad":""}"><b>${bad.size}</b><span>clashes</span></div>` : `<div class="stat"><b>TBA</b><span>set times</span></div>`;
  let h = `<div class="pcard gframe"><div class="sheen" aria-hidden="true"></div><div class="pcard-head"><div><div class="eyebrow"><span class="star">★ P1</span> Player card <span class="sep">·</span> ${esc(EDITION.name)}</div><h2>${esc(EDITION.card)}</h2><div class="sub">${esc(EDITION.code)} · ${esc(EDITION.dateLong)} · ${esc(EDITION.venue)}</div></div>
    <div class="stats"><div class="stat"><b>${chosen.length}</b><span>sets</span></div><div class="stat kr"><b>${totalKr()}</b><span>kick rolls</span></div>${third}</div></div><div class="thorn" aria-hidden="true"></div>`;
  if(!chosen.length){
    h += `<p class="empty" style="padding:20px 22px">nothing cooking yet. on the <b>quest board</b>, hit <b>+</b> on the ${TIMED ? "sets" : "acts"} you want, then tap each artist and KR the songs you'll kick roll to.</p>`;
  } else if(!TIMED){
    // lineup mode: lineup order, no times, no clashes
    h += `<ol class="run">`;
    for(const s of chosen){
      h += `<li style="--c:${s.row === "head" ? "var(--gold-hi)" : "var(--p-magenta)"}"><div class="time">TBA<small>${esc(rowLabel(s))}</small></div><div>
        <div class="who"><button data-open="${esc(slotId(s))}">${esc(s.artist)}</button>${s.tag ? `<span class="st">${esc(s.tag)}</span>` : ""}</div>
        ${krItems(s)}
      </div></li>`;
    }
    h += `</ol>`;
  } else {
    h += `<ol class="run">`;
    chosen.forEach((s, i) => {
      const prev = chosen[i-1];
      if(prev && !bad.has(slotId(s))){
        const gap = s.s - prev.e;
        if(gap >= 15) h += `<li class="gap" aria-hidden="true"><b>${gap} min</b> free · ${fmt(prev.e)}–${s.start}</li>`;
        else if(prev.stage !== s.stage && gap >= 0) h += `<li class="gap" aria-hidden="true">Move to <b>${esc(STAGES[s.stage].name)}</b>${gap?` · ${gap} min`:" · no gap"}</li>`;
      }
      const c = bad.get(slotId(s));
      const live = now!==null && s.s <= now && now < s.e ? `<span class="live">on now</span>` : (i===nextIdx ? `<span class="live">up next</span>` : "");
      h += `<li style="--c:${stageColor(s.stage)}"><div class="time">${s.start}–${s.end}<small>${s.e-s.s} min</small></div><div>
        <div class="who"><button data-open="${esc(slotId(s))}">${esc(s.artist)}</button><span class="st">${esc(STAGES[s.stage].name)}</span>${live}</div>
        ${c?`<div class="clashnote">Clashes with ${c.map(x=>esc(x.artist)).join(", ")}</div>`:""}
        ${krItems(s)}
      </div></li>`;
    });
    h += `</ol>`;
  }
  h += `</div><div class="card-tools"><button class="btn primary" id="copyCard">Copy card</button><button class="btn" id="clearAll">reset everything</button></div><div id="copyFallback"></div>`;
  document.getElementById("cardWrap").innerHTML = h;
  syncPlay();
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 1800); }

// ---------- events ----------
let confirmReset = false;
function setTab(card){
  document.getElementById("tab-tt").setAttribute("aria-selected", !card);
  document.getElementById("tab-card").setAttribute("aria-selected", card);
  document.getElementById("view-tt").hidden = card; document.getElementById("view-card").hidden = !card;
  document.body.classList.toggle("on-card", card);
  renderMain();
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if(pick){ const id = pick.dataset.pick; picks.has(id) ? picks.delete(id) : picks.add(id); save(); renderHud(); if(sheetState.id) renderSheet(true); else renderMain(); toast(picks.has(id) ? "locked in" : "dropped from your run"); return; }
  const open = e.target.closest("[data-open]");
  if(open){ openSheet(open.dataset.open, open); return; }
  const k = e.target.closest("[data-kr]");
  if(k){
    const s = curSlot(); const t = k.dataset.kr;
    toggleKr(s.artist, t);
    if(isKr(s.artist,t) && !picks.has(sheetState.id)){ picks.add(sheetState.id); save(); renderHud(); renderSheet(true); toast("KR saved. set locked in"); return; }
    if(krOnly) renderSheetList(); else syncKr();
    return; }
  const pl = e.target.closest("[data-play]");
  if(pl){ if(!pl.disabled) playTrack(pl.dataset.play); return; }
  if(e.target.closest("#npStop")){ stopAudio(); return; }
  if(e.target.closest("#krOnly")){ krOnly = !krOnly; renderSheet(); return; }
  const del = e.target.closest("[data-del]");
  if(del){ const s = curSlot(); const t = del.dataset.del;
    custom[s.artist] = (custom[s.artist]||[]).filter(x => x!==t); if(!custom[s.artist].length) delete custom[s.artist];
    if(isKr(s.artist,t)) toggleKr(s.artist,t);
    save(); renderSheet(true); return; }
  const mode = e.target.closest("[data-mode]");
  if(mode){ sheetState.mode = mode.dataset.mode; renderSheet(); const t = document.getElementById("st-" + sheetState.mode); if(t) t.focus({preventScroll:true}); return; }
  const sw = e.target.closest("[data-view]");
  if(sw){ view = sw.dataset.view; store.set("view", view); renderSwitch(); renderTT(); return; }
  if(e.target.closest("#closeSheet") || e.target.id==="scrim"){ closeSheet(); return; }
  const tab = e.target.closest(".tab");
  if(tab){ setTab(tab.id==="tab-card"); return; }
  if(e.target.id==="copyCard"){
    const txt = cardText();
    const fb = () => { document.getElementById("copyFallback").innerHTML = `<textarea class="copybox" id="copyBox" readonly aria-label="Card text"></textarea>`; const b=document.getElementById("copyBox"); b.value = txt; b.focus(); b.select(); toast("copy blocked here. text is selected, copy it manually"); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast("card copied"), fb); }catch(err){ fb(); }
    return; }
  if(e.target.id==="clearAll"){
    if(!confirmReset){ confirmReset = true; e.target.textContent = "tap again to wipe it"; setTimeout(()=>{confirmReset=false; const b=document.getElementById("clearAll"); if(b) b.textContent="reset everything";}, 3000); return; }
    picks = new Set(); kr = {}; custom = {}; save(); confirmReset=false; renderAll(); toast("wiped clean"); return; }
});
document.addEventListener("input", e => { if(e.target.id==="trackSearch"){ sheetState.q = e.target.value; renderSheetList(); } });
document.addEventListener("submit", e => {
  if(e.target.id!=="addOwn") return; e.preventDefault();
  const v = document.getElementById("ownTrack").value.trim(); if(!v) return;
  const s = curSlot();
  if(!(custom[s.artist]||[]).includes(v)) custom[s.artist] = [...(custom[s.artist]||[]), v];
  save(); sheetState.q = ""; krOnly = false; renderSheet(true); const inp = document.getElementById("ownTrack"); if(inp) inp.focus({preventScroll:true}); toast("song added. tap KR to keep it");
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && sheetState.id){ closeSheet(); return; }
  const t = e.target.closest && e.target.closest('.seg [role="tab"]');
  if(t && (e.key==="ArrowRight" || e.key==="ArrowLeft")){
    const all = [...document.querySelectorAll('.seg [role="tab"]')];
    const nx = all[(all.indexOf(t) + (e.key==="ArrowRight" ? 1 : all.length - 1)) % all.length];
    e.preventDefault(); nx.click();
  }
});
const onNarrow = () => renderTT();
if(narrow.addEventListener) narrow.addEventListener("change", onNarrow); else if(narrow.addListener) narrow.addListener(onNarrow);
setInterval(() => { if(TIMED && nowMin()!==null && !sheetState.id) renderMain(); }, 60000);

function renderBoard(){ if(TIMED){ renderSwitch(); renderTT(); } else if(POSTER) renderPoster(); else renderLineup(); }
function renderMain(){
  if(!document.getElementById("view-tt").hidden) renderBoard();
  if(!document.getElementById("view-card").hidden) renderCard();
}
function renderAll(){ renderChrome(); renderBoard(); renderCard(); renderHud(); }
renderAll();
</script>
</body>
