<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chef's quest boards: pick a rave for its set times, lineup, kickroll leaderboard, gallery and groups.">
<meta name="theme-color" content="#0a0a0b">
<title>Chef's Quest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Pirata+One&family=Cinzel:wght@500;700&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Landing: the rave select screen. Same chrome as the boards (warm near-black, gold item-frame corners),
   one poster-like card per rave from raves.json, each with its own drawn scene. */
:root{
  color-scheme: dark;
  --bg:#0a0a0b;
  --panel:#16110a;
  --panel-2:#1a1206;
  --line:#3a2e1a;
  --fg:#f4ecd8;
  --fg-2:#e8d7a9;
  --muted:#9a8f74;
  --dim:#6b6250;
  --gold:#c9a84c;
  --gold-hi:#ffc85a;
  --violet:#7b2cff;
  --blood-dk:#7c1f14;
  --blackletter:"Pirata One", "UnifrakturCook", "Old English Text MT", Georgia, serif;
  --rpg:"Cinzel", "Trajan Pro", Georgia, serif;
  --display:"Oswald", "Arial Narrow", system-ui, sans-serif;
  --pixel:"Silkscreen", "Courier New", ui-monospace, monospace;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lockup:"Anton", "Oswald", "Impact", "Haettenschweiler", "Arial Narrow", sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background-color:var(--bg)}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 260px at 50% 0, color-mix(in srgb,var(--violet) 14%,transparent), transparent 80%),
    radial-gradient(ellipse 50% 40% at 100% 100%, color-mix(in srgb,var(--blood-dk) 18%,transparent), transparent 80%);
  background-repeat:no-repeat;
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}

/* gold pixel item-frame corners (stepped), same as the boards */
.gframe{position:relative}
.gframe::before{content:"";position:absolute;inset:5px;pointer-events:none;z-index:4;--gc:var(--gold);
  background:
    linear-gradient(var(--gc),var(--gc)) left top/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left top/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px top 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px top 6px/3px 6px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right top/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right top/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px top 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px top 6px/3px 6px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left bottom/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left bottom/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px bottom 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px bottom 6px/3px 6px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right bottom/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right bottom/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px bottom 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px bottom 6px/3px 6px no-repeat}
.thorn{position:relative;height:12px;margin:0;border:0}
.thorn::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent)}
.thorn::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:8px;transform:translate(-50%,-50%);background:var(--gold);clip-path:polygon(0 50%,40% 0,50% 50%,60% 0,100% 50%,60% 100%,50% 50%,40% 100%)}

/* ---------- header ---------- */
.top{padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;padding-bottom:12px}
.brand .emblem{display:block;width:118px;height:auto;flex:none;color:var(--fg)}
.brand .txt{min-width:0}
.eyebrow{font-family:var(--rpg);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--gold)}
.eyebrow .sep{color:var(--dim)}
.brand h1{font-family:var(--blackletter);font-weight:400;font-size:clamp(32px,5.4vw,50px);line-height:1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance;color:var(--fg);
  text-shadow:0 0 14px color-mix(in srgb,var(--gold) 30%,transparent)}
.brand .sub{font-size:14px;color:var(--fg-2);margin-top:6px}
.brand .sub b{font-family:var(--pixel);font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--gold-hi);margin-right:6px}

/* ---------- rave grid ---------- */
.raves{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){
  .raves{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1040px){
  .raves{grid-template-columns:repeat(3,minmax(0,1fr))}
  .raves > .rave.feature{grid-column:span 2}
}

.rave{position:relative;isolation:isolate;overflow:hidden;min-height:max(440px,60vh);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(230px,1fr) auto;
  border:1px solid var(--line);background:#0a0a0b;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.8),inset 0 0 0 1px color-mix(in srgb,var(--gold) 12%,transparent);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
@media (min-width:760px){ .rave{min-height:600px;grid-template-rows:minmax(280px,1fr) auto} .rave .badge-wrap{margin-top:40px} }
/* the scene (and the optional photo) fill row 1 and run 70px under the text, where the body's gradient fades them out */
.rave .art,.rave .photo{grid-row:1;grid-column:1;position:relative;z-index:-2;margin-bottom:-70px;background:var(--th-bg1,#120a24)}
.rave .art svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.rave .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);pointer-events:none}
.rave .photo{z-index:-1;background:center/cover no-repeat;opacity:0;transition:opacity .5s ease}
.rave.has-photo .photo{opacity:1}
.rave .badge-wrap{grid-row:1;grid-column:1;align-self:start;justify-self:center;width:min(84%,420px);margin-top:54px;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--th-accent,#ffc85a) 20%,transparent),transparent)}
.rave .badge-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.rave.has-photo .badge-wrap{display:none}

.rave .pill{position:absolute;top:18px;left:18px;z-index:3;display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 9px;
  font-family:var(--pixel);font-size:11px;letter-spacing:.04em;line-height:1;color:var(--fg);
  background:rgba(10,10,11,.72);border:1px solid var(--line);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pill::before{content:"";width:7px;height:7px;background:currentColor;flex:none}
.pill.live{color:#ff4f6e;border-color:#ff4f6e}
.pill.upcoming{color:#3fd2ff;border-color:color-mix(in srgb,#3fd2ff 60%,transparent)}
.pill.recent{color:var(--gold-hi);border-color:var(--gold)}
.pill.past{color:var(--muted)}
.pill span{color:var(--fg)}

.rave .body{grid-row:2;grid-column:1;padding:26px 20px 18px;
  background:linear-gradient(180deg,rgba(10,10,11,0) 0,rgba(10,10,11,.82) 44px,#0a0a0b 92px)}
.rave .eyebrow{font-size:11.5px}
.rave h2{font-family:var(--lockup);font-weight:400;text-transform:uppercase;font-size:clamp(40px,11vw,64px);line-height:.92;letter-spacing:.005em;margin:4px 0 0;color:var(--th-ink,#fff);
  text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 24px color-mix(in srgb,var(--th-bg2,#4a1f8a) 70%,transparent)}
.rave .edition{font-family:var(--blackletter);font-size:clamp(26px,6.4vw,34px);line-height:1.05;color:var(--th-accent,var(--gold-hi));margin-top:2px;
  text-shadow:0 0 16px color-mix(in srgb,var(--th-accent,#ffc85a) 35%,transparent)}
.rave .meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:10px;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--fg)}
.rave .meta .sep{color:var(--gold)}
.rave .city{font-family:var(--display);font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.rave .tagline{margin:8px 0 0;color:var(--fg-2);font-size:14px;max-width:46ch}

.rave .go{position:static;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;min-height:52px;padding:0 16px 0 18px;
  font-family:var(--rpg);font-weight:700;font-size:15px;letter-spacing:.1em;text-decoration:none;color:#1a1206;
  background:linear-gradient(180deg,#ffe08f,var(--gold-hi) 45%,var(--gold));border:1px solid #ffe7a0;
  box-shadow:0 0 0 1px #1a1206 inset,0 6px 18px -6px color-mix(in srgb,var(--gold-hi) 55%,transparent)}
.rave .go svg{width:18px;height:18px;flex:none}
/* the whole card is the main link */
.rave .go::after{content:"";position:absolute;inset:0;z-index:1}
.rave .go:focus-visible{outline:2px solid #fff;outline-offset:3px}
.rave .quick{position:relative;z-index:3;display:flex;flex-wrap:wrap;align-items:center;margin:8px 0 0;padding:0;list-style:none}
.rave .quick li{display:flex;align-items:center}
.rave .quick li + li::before{content:"";width:4px;height:4px;background:var(--gold);margin:0 2px;flex:none}
.rave .quick a{display:inline-flex;align-items:center;min-height:40px;padding:0 7px;color:var(--fg-2);font-family:var(--rpg);font-weight:700;font-size:12px;letter-spacing:.03em;text-decoration:none;
  text-underline-offset:4px;text-decoration-color:var(--gold)}
.rave .quick li:first-child a{padding-left:0}
@media (max-width:479px){
  .rave{grid-template-rows:minmax(210px,1fr) auto}
  .rave .tagline{display:none}
  .rave .quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .rave .quick li + li::before{content:none}
  .rave .quick a,.rave .quick li:first-child a{width:100%;justify-content:center;padding:0 8px;border:1px solid var(--line);background:var(--panel)}
}
@media (hover:hover){
  .rave:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 26px 50px -20px rgba(0,0,0,.9),0 0 0 1px color-mix(in srgb,var(--gold) 25%,transparent)}
  .rave .quick a:hover{color:var(--gold-hi);text-decoration-line:underline}
}

/* the muted "more coming" slot */
.soon{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:190px;padding:28px 20px;
  border:1px dashed color-mix(in srgb,var(--gold) 35%,var(--line));color:var(--muted);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 10px,transparent 10px 20px),var(--panel)}
.soon.gframe::before{--gc:color-mix(in srgb,var(--gold) 45%,transparent)}
.soon svg{width:44px;height:44px;opacity:.75}
.soon h3{margin:0;line-height:1.05;text-wrap:balance;font-family:var(--lockup);font-weight:400;text-transform:uppercase;font-size:28px;letter-spacing:.01em;color:var(--fg-2);opacity:.75}
.soon p{margin:0;font-size:13.5px;max-width:30ch}
.soon .slot{font-family:var(--pixel);font-size:10.5px;color:var(--dim)}
@media (min-width:760px){ .soon{min-height:560px} }

.err{margin:18px 0 0;padding:16px;border:1px solid var(--line);background:var(--panel);color:var(--fg-2)}
.err a{color:var(--gold-hi)}

.foot{margin-top:28px;color:var(--dim);font-size:12.5px;line-height:1.6;max-width:70ch}
.foot b{color:var(--muted)}
.foot + .foot{margin-top:6px}

/* scene motion (subtle) */
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes sway2{from{transform:rotate(5deg)}to{transform:rotate(-3deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.art .beams-a{animation:sway 7s ease-in-out infinite alternate}
.art .beams-b{animation:sway2 9s ease-in-out infinite alternate}
.art .beams-c{animation:sway 11s ease-in-out -3s infinite alternate}
.art .tw{animation:twinkle 3.2s ease-in-out infinite}
.art .xp-next{animation:blink 1.1s steps(1) infinite}
.art .plus{animation:rise 3.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){
  .art *{animation:none!important}
  .rave{transition:none}
  .rave:hover{transform:none}
}
</style>
</head>

<script src="ko-track.js" defer></script>
<script>
(function(){
const list = document.getElementById("raves");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = (c, d) => /^#[0-9a-f]{3,8}$/i.test(c || "") ? c : d;
const relHref = h => (typeof h === "string" && /^[\w.\-\/]+(#[\w=\-]*)?$/.test(h) && !/^\/\//.test(h)) ? h : null;

// ---------- status from the date, in the rave's own time zone ----------
function todayIn(tz){
  try{ return new Intl.DateTimeFormat("en-CA", {timeZone: tz || "Australia/Sydney", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date()); }
  catch(e){ return new Date().toISOString().slice(0, 10); }
}
const dayNum = s => Math.round(Date.parse(s + "T00:00:00Z") / 864e5);
function statusOf(r){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date || "")){
    const s = r.status;
    return s === "live" ? {k:"live", label:"Live now"} : s === "upcoming" ? {k:"upcoming", label:"Upcoming"} : {k:"past", label:"Past"};
  }
  const diff = dayNum(r.date) - dayNum(todayIn(r.tz));   // >0 = days to go
  if(diff === 0) return {k:"live", label:"Live now", diff};
  if(diff > 0) return {k:"upcoming", label: niceDate(r.date), sub: diff === 1 ? "tomorrow" : diff <= 30 ? "in " + diff + " days" : "", diff};
  return {k: diff >= -9 ? "recent" : "past", label: niceDate(r.date), diff};
}
function niceDate(d){
  try{ return new Intl.DateTimeFormat("en-AU", {timeZone:"UTC", weekday:"short", day:"numeric", month:"short", year:"numeric"}).format(new Date(d + "T00:00:00Z")).replace(/,/g, ""); }
  catch(e){ return d; }
}

// ---------- drawn backgrounds, keyed by rave.art ----------
const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PIX = {
  L:["10000","10000","10000","10000","10000","10000","11111"],
  E:["11111","10000","10000","11110","10000","10000","11111"],
  V:["10001","10001","10001","10001","10001","01010","00100"],
  U:["10001","10001","10001","10001","10001","10001","01110"],
  P:["11110","10001","10001","11110","10000","10000","10000"],
  " ":["00000","00000","00000","00000","00000","00000","00000"]
};
function pixelPath(text, x0, y0, s){
  let d = "", x = x0;
  for(const ch of text){
    const g = PIX[ch] || PIX[" "];
    g.forEach((row, j) => { for(let i = 0; i < 5; i++) if(row[i] === "1") d += `M${x + i * s} ${y0 + j * s}h${s}v${s}h-${s}z`; });
    x += (ch === " " ? 3 : 6) * s;
  }
  return {d, w: x - x0 - s};
}
const sparkle = (x, y, s, fill, cls, delay) =>
  `<path class="${cls || ""}" style="animation-delay:${delay || 0}s" fill="${fill}" d="M${x} ${y - 2 * s}h${s}v${s}h-${s}zM${x} ${y + s}h${s}v${s}h-${s}zM${x - 2 * s} ${y}h${s}v${s}h-${s}zM${x + 2 * s} ${y}h${s}v${s}h-${s}zM${x} ${y}h${s}v${s}h-${s}z"/>`;

const ART = {
  // KO26 "Level Up": a purple stadium night, stage lasers in the three stage colours, an arcade level-up overhead
  ko26(t, uid){
    const st = t.stages || {}, A = color(st.arena, "#3fd2ff"), P = color(st.pit, "#ff4f6e"), O = color(st.oasis, "#ffa94d");
    const bg1 = color(t.bg1, "#120a24"), bg2 = color(t.bg2, "#4a1f8a"), acc = color(t.accent, "#ffc85a"), gold = color(t.gold, "#c9a84c");
    const R = rng(26), id = k => uid + "-" + k;
    const W = 600, H = 640, HZ = 418, SX = 300, SY = 394;   // horizon, stage source

    // stars: tiny pixels, a few twinkling sparkles
    let stars = "";
    for(let i = 0; i < 120; i++){
      const x = Math.round(R() * 1000 - 200), y = Math.round(R() * (HZ - 120)), s = R() < .15 ? 3 : 2;
      stars += `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${R() < .3 ? acc : "#e7dcff"}" opacity="${(.25 + R() * .6).toFixed(2)}"/>`;
    }
    const sparks = [[92,66,acc],[512,96,"#e7dcff"],[150,262,A],[468,248,P],[548,196,acc],[52,190,"#e7dcff"]]
      .map(([x, y, c], i) => sparkle(x, y, 3, c, "tw", -i * .55)).join("");

    // laser fans: thin wedges from the stage, glow copy underneath
    const beam = (ang, len, w) => {
      const a = ang * Math.PI / 180, ex = SX + Math.sin(a) * len, ey = SY - Math.cos(a) * len;
      const nx = Math.cos(a) * w, ny = Math.sin(a) * w;
      return `M${SX} ${SY}L${(ex - nx).toFixed(1)} ${(ey - ny).toFixed(1)}L${(ex + nx).toFixed(1)} ${(ey + ny).toFixed(1)}Z`;
    };
    const fan = (angs, c, cls) => {
      const d = angs.map(a => beam(a, 620, 5)).join(""), core = angs.map(a => beam(a, 620, 1.2)).join("");
      return `<g class="${cls}" style="transform-origin:${SX}px ${SY}px">
        <path d="${d}" fill="url(#${id("fade")}-${cls})" filter="url(#${id("blur")})" opacity=".9"/>
        <path d="${core}" fill="url(#${id("fade")}-${cls})"/></g>`;
    };
    const fadeGrad = (cls, c) => `<linearGradient id="${id("fade")}-${cls}" gradientUnits="userSpaceOnUse" x1="${SX}" y1="${SY}" x2="${SX}" y2="-180">
      <stop offset="0" stop-color="${c}" stop-opacity="1"/><stop offset=".55" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>`;

    // tower beams from the side masts, crossing over the stage
    const tower = (x, y, angs, c) => angs.map(a => {
      const r = a * Math.PI / 180, ex = x + Math.sin(r) * 700, ey = y - Math.cos(r) * 700;
      return `<line x1="${x}" y1="${y}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${c}" stroke-width="1.4" opacity=".55"/>`;
    }).join("");

    // stadium: bowl, roof canopy with ribs, light masts
    let ribs = "";
    for(let i = 0; i <= 26; i++){
      const x = 74 + i * (452 / 26), yTop = 360 - Math.sin(Math.PI * i / 26) * 42, yBot = yTop + 10;
      ribs += `<line x1="${x.toFixed(1)}" y1="${yTop.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(yBot + 34).toFixed(1)}" stroke="${bg2}" stroke-width="1" opacity=".55"/>`;
    }
    const mast = (x, top) => {
      let cells = "";
      for(let r = 0; r < 2; r++) for(let c = 0; c < 4; c++) cells += `<rect x="${x - 13 + c * 7}" y="${top + r * 6}" width="5" height="4" fill="#fff6dc"/>`;
      return `<rect x="${x - 1.5}" y="${top + 10}" width="3" height="${HZ - top - 10}" fill="#0b0617"/>
        <rect x="${x - 16}" y="${top - 3}" width="32" height="16" fill="#0b0617"/>${cells}
        <ellipse cx="${x}" cy="${top + 5}" rx="34" ry="16" fill="url(#${id("lamp")})"/>`;
    };

    // crowd: heads and hands up, along the bottom of the bowl
    let crowd = "", arms = "";
    for(let x = -210; x < W + 220; x += 15 + Math.round(R() * 6)){
      const y = HZ + 22 + Math.round(R() * 10), r = 8 + Math.round(R() * 4);
      crowd += `<circle cx="${x}" cy="${y}" r="${r}"/><rect x="${x - r - 3}" y="${y + r - 2}" width="${2 * r + 6}" height="80" rx="${r}"/>`;
      if(R() < .38){
        const side = R() < .5 ? -1 : 1, hx = x + side * (10 + R() * 12), hy = y - 30 - R() * 22;
        arms += `<path d="M${x + side * 6} ${y + 6}L${hx.toFixed(1)} ${hy.toFixed(1)}" />`;
        if(R() < .45) arms += `<path d="M${x - side * 6} ${y + 6}L${(x - side * (6 + R() * 10)).toFixed(1)} ${(hy + 4).toFixed(1)}" />`;
      }
    }

    // floor grid
    let grid = "";
    for(let i = -18; i <= 18; i++) grid += `<line x1="${SX}" y1="${HZ}" x2="${SX + i * 70}" y2="${H}" />`;
    for(let k = 1; k <= 7; k++){ const y = HZ + Math.pow(k / 7, 2.1) * (H - HZ); grid += `<line x1="-200" y1="${y.toFixed(1)}" x2="${W + 200}" y2="${y.toFixed(1)}" />`; }

    // LEVEL UP in pixels + XP bar
    const S = 8, lu = pixelPath("LEVEL UP", 0, 0, S), lx = Math.round((W - lu.w) / 2), ly = 108;
    const segs = 18, filled = 15, bx = 162, bw = 276, by = ly + 7 * S + 26, sw = (bw - 8 - (segs - 1) * 3) / segs;
    let xp = "";
    for(let i = 0; i < segs; i++){
      const f = i < filled, nx = i === filled;
      xp += `<rect class="${nx ? "xp-next" : ""}" x="${(bx + 4 + i * (sw + 3)).toFixed(1)}" y="${by + 4}" width="${sw.toFixed(1)}" height="8" fill="${f ? `url(#${id("xp")})` : nx ? acc : "#2a1a4a"}"/>`;
    }

    const scene = `<svg class="scene" viewBox="-200 110 1000 430" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
<defs>
  <linearGradient id="${id("sky")}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07040f"/><stop offset=".35" stop-color="${bg1}"/><stop offset=".62" stop-color="${bg2}"/><stop offset=".66" stop-color="#2a1250"/><stop offset="1" stop-color="#07040f"/>
  </linearGradient>
  <radialGradient id="${id("haze")}" cx="${SX}" cy="${HZ - 20}" r="440" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 ${HZ - 20}) scale(1 .45) translate(0 -${HZ - 20})">
    <stop offset="0" stop-color="#e94fd6" stop-opacity=".75"/><stop offset=".4" stop-color="#a855f7" stop-opacity=".35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="${id("lamp")}"><stop offset="0" stop-color="#fff2c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
  <radialGradient id="${id("halo")}" cx="${W / 2}" cy="${ly + 28}" r="220" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="${acc}" stop-opacity=".22"/><stop offset="1" stop-color="${acc}" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="${id("gold")}" x1="0" y1="${ly}" x2="0" y2="${ly + 7 * S}" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff3c8"/><stop offset=".42" stop-color="${acc}"/><stop offset=".43" stop-color="#f0b23e"/><stop offset="1" stop-color="${gold}"/>
  </linearGradient>
  <linearGradient id="${id("xp")}" x1="${bx}" x2="${bx + bw}" y1="0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="${A}"/><stop offset=".5" stop-color="${P}"/><stop offset="1" stop-color="${O}"/>
  </linearGradient>
  ${fadeGrad("beams-a", A)}${fadeGrad("beams-b", P)}${fadeGrad("beams-c", O)}
  <filter id="${id("blur")}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="${id("soft")}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect x="-200" width="1000" height="${H}" fill="url(#${id("sky")})"/>
<g>${stars}</g>
<g style="mix-blend-mode:screen">
  ${fan([-58,-44,-30,-17], A, "beams-a")}
  ${fan([-9,-3,3,9], P, "beams-b")}
  ${fan([17,30,44,58], O, "beams-c")}
  ${tower(110, 298, [28,40], A)}${tower(490, 298, [-28,-40], O)}
</g>
<ellipse cx="${SX}" cy="${HZ - 20}" rx="460" ry="150" fill="url(#${id("haze")})"/>
<g>${sparks}</g>

<!-- stadium -->
<g>
  ${mast(110, 290)}${mast(490, 290)}${mast(46, 318)}${mast(554, 318)}
  <path d="M30 ${HZ + 4}L58 360Q300 300 542 360L570 ${HZ + 4}Z" fill="#0b0617"/>
  <path d="M58 360Q300 300 542 360" fill="none" stroke="#a855f7" stroke-width="2" opacity=".85"/>
  <path d="M66 352Q300 290 534 352L540 344Q300 280 60 344Z" fill="#140a28" stroke="${gold}" stroke-opacity=".5" stroke-width="1"/>
  ${ribs}
  <path d="M90 392Q300 350 510 392" fill="none" stroke="${A}" stroke-width="1.5" stroke-dasharray="2 5" opacity=".7"/>
  <path d="M74 404Q300 362 526 404" fill="none" stroke="${P}" stroke-width="1.5" stroke-dasharray="2 6" opacity=".55"/>
  <rect x="${SX - 54}" y="${SY - 18}" width="108" height="24" fill="#0b0617" stroke="${acc}" stroke-width="1.5"/>
  <rect x="${SX - 48}" y="${SY - 14}" width="96" height="16" fill="url(#${id("xp")})" opacity=".85"/>
  <ellipse cx="${SX}" cy="${SY}" rx="60" ry="14" fill="#fff" opacity=".35" filter="url(#${id("soft")})"/>
</g>

<!-- floor + crowd -->
<g stroke="#a855f7" stroke-width="1" opacity=".28">${grid}</g>
<g fill="#05030a">${crowd}</g>
<g stroke="#05030a" stroke-width="7" stroke-linecap="round" fill="none">${arms}</g>
</svg>`;
    const badge = `<svg class="badge" viewBox="${lx - 48} ${ly - 30} ${lu.w + 96} ${by - ly + 52}" aria-hidden="true" focusable="false">

<g>
  <path d="${lu.d}" transform="translate(${lx + 5} ${ly + 5})" fill="#1a0a33"/>
  <path d="${lu.d}" transform="translate(${lx + 2.5} ${ly + 2.5})" fill="${bg2}"/>
  <path d="${lu.d}" transform="translate(${lx} ${ly})" fill="url(#${id("gold")})"/>
  <path d="${pixelPath("LEVEL UP", 0, 0, S).d.replace(/v8h-8z/g, "v2h-8z")}" transform="translate(${lx} ${ly})" fill="#fffbe6" opacity=".55"/>
</g>
<g font-family="Silkscreen, 'Courier New', monospace" font-size="13" letter-spacing="1">
  <text x="${bx}" y="${by - 8}" fill="#d9c8ff">EXP</text>
  <text x="${bx + bw}" y="${by - 8}" fill="${acc}" text-anchor="end">LV 25 &#9656; 26</text>
  <rect x="${bx}" y="${by}" width="${bw}" height="16" fill="#0b0617" stroke="#e7dcff" stroke-width="2"/>
  ${xp}
  <text class="plus" x="${bx + bw + 12}" y="${by + 14}" fill="${acc}" font-size="14">+XP</text>
</g>
${sparkle(lx - 26, ly + 12, 4, acc, "tw", -.3)}${sparkle(lx + lu.w + 22, ly + 40, 4, acc, "tw", -1.6)}${sparkle(lx + lu.w + 8, ly - 18, 3, "#e7dcff", "tw", -2.2)}

</svg>`;
    return {scene, badge};
  },

  // fallback for a rave without its own scene yet: poster gradient, grid floor, a single beam fan
  _default(t, uid){
    const bg1 = color(t.bg1, "#120a24"), bg2 = color(t.bg2, "#4a1f8a"), acc = color(t.accent, "#ffc85a");
    let grid = ""; for(let i = -10; i <= 10; i++) grid += `<line x1="300" y1="380" x2="${300 + i * 80}" y2="640"/>`;
    return {badge: "", scene: `<svg class="scene" viewBox="0 0 600 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
<defs><linearGradient id="${uid}-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07040f"/><stop offset=".45" stop-color="${bg1}"/><stop offset=".6" stop-color="${bg2}"/><stop offset="1" stop-color="#07040f"/></linearGradient></defs>
<rect width="600" height="640" fill="url(#${uid}-g)"/>
<g stroke="${acc}" stroke-width="1" opacity=".25">${grid}</g></svg>`};
  }
};

// ---------- cards ----------
const ICON_GO = `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5 2h2v2H5zM7 4h2v2H7zM9 6h2v4H9zM7 10h2v2H7zM5 12h2v2H5z" fill="currentColor"/></svg>`;
const ICON_LOCK = `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M5 2h6v1H5zM4 3h1v4H4zM11 3h1v4h-1zM3 7h10v7H3z"/><path fill="#16110a" d="M7 9h2v3H7z"/></svg>`;

function card(r, i, feature){
  const t = r.theme || {}, s = statusOf(r), uid = "rv" + i;
  const page = relHref(r.page);
  const draw = ART[r.art] || ART._default;
  const li = document.createElement("li");
  li.className = "rave gframe" + (feature ? " feature" : "");
  li.style.setProperty("--th-bg1", color(t.bg1, "#120a24"));
  li.style.setProperty("--th-bg2", color(t.bg2, "#4a1f8a"));
  li.style.setProperty("--th-accent", color(t.accent, "#ffc85a"));
  li.style.setProperty("--th-ink", color(t.ink, "#ffffff"));
  const year = (r.date || "").slice(0, 4);
  const quick = [];
  if(page) quick.push(`<li><a href="${esc(page)}">Set times &amp; lineup</a></li>`);
  (Array.isArray(r.links) ? r.links : []).forEach(l => { const h = relHref(l && l.href); if(h) quick.push(`<li><a href="${esc(h)}">${esc(l.label)}</a></li>`); });
  li.innerHTML = `
    ${(a => `<div class="art">${a.scene}</div>${a.badge ? `<div class="badge-wrap">${a.badge}</div>` : ""}`)(draw(t, uid))}
    <div class="photo"></div>
    <span class="pill ${s.k}">${esc(s.label)}${s.sub ? ` <span>${esc(s.sub)}</span>` : ""}</span>
    <div class="body">
      <div class="eyebrow">${esc(r.tag || r.id)}${year ? ` <span class="sep">·</span> ${esc(year)}` : ""}</div>
      <h2>${esc(r.name)}</h2>
      ${r.edition ? `<div class="edition">${esc(r.edition)}</div>` : ""}
      <div class="meta">${[r.date ? niceDate(r.date) : "", r.venue].filter(Boolean).map(esc).join(' <span class="sep">·</span> ')}</div>
      ${r.city ? `<div class="city">${esc(r.city)}</div>` : ""}
      ${r.tagline ? `<p class="tagline">${esc(r.tagline)}</p>` : ""}
      ${page ? `<a class="go" href="${esc(page)}" aria-label="Open the ${esc(r.name)}${r.edition ? " " + esc(r.edition) : ""} quest board"><span>Enter quest board</span>${ICON_GO}</a>` : ""}
      ${quick.length ? `<ul class="quick" aria-label="${esc(r.tag || r.name)} pages">${quick.join("")}</ul>` : ""}
    </div>`;
  // optional photo: only shown once it actually loads; the drawn art stays as the fallback
  if(r.image && typeof r.image === "string" && /^[\w.\-\/]+\.(webp|jpe?g|png|avif)$/i.test(r.image)){
    const img = new Image();
    img.onload = () => { li.querySelector(".photo").style.backgroundImage = `linear-gradient(180deg,rgba(10,10,11,.15),rgba(10,10,11,.55)),url("${r.image}")`; li.classList.add("has-photo"); };
    img.src = r.image;
  }
  return li;
}

function soon(){
  const li = document.createElement("li");
  li.className = "soon gframe";
  li.setAttribute("aria-label", "More raves coming");
  li.innerHTML = `${ICON_LOCK}<div class="slot">Quest slot locked</div><h3>More raves coming</h3><p>The next board unlocks when the next set times drop.</p>`;
  return li;
}

const order = {live:0, upcoming:1, recent:2, past:3};
function render(raves){
  const rs = raves.filter(r => r && r.id && r.name).map(r => ({r, s: statusOf(r)}));
  rs.sort((a, b) => order[a.s.k] - order[b.s.k] || (a.s.k === "upcoming" ? a.r.date.localeCompare(b.r.date) : (b.r.date || "").localeCompare(a.r.date || "")));
  list.textContent = "";
  rs.forEach(({r}, i) => list.appendChild(card(r, i, i === 0)));
  list.appendChild(soon());
}

fetch("raves.json", {cache: "no-cache"})
  .then(res => { if(!res.ok) throw new Error(res.status); return res.json(); })
  .then(d => render(Array.isArray(d) ? d : []))
  .catch(() => {
    list.insertAdjacentHTML("afterend", `<p class="err">Couldn't load the raves list. Go straight to the <a href="ko26.html">KO26 quest board</a>.</p>`);
  });
})();
</script>
</body>
</html>
