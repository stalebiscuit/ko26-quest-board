  const rows = mine.map(t => {
    const [ar, ti] = splitTrack(t), on = isKr(artist, t);
    return `<li class="row mine${on ? " on" : ""}"><div class="r-main"><div class="r-t"><span class="ti">${esc(ti)}</span>${ar ? `<span class="ar">${esc(ar)}</span>` : ""}</div>${krBtn(t, on)}<button class="del" data-del="${esc(t)}" aria-label="Remove ${esc(t)}">×</button></div></li>`;
  }).join("");
  return `<div class="box"><div class="box-h"><b>songs you added</b><span>tracks you reckon they'll drop. KR them like any other.</span></div>
    ${rows ? `<ul class="list">${rows}</ul>` : ""}
    <form class="addown" id="addOwn"><input id="ownTrack" placeholder="Artist - Track title" aria-label="Add a track" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form></div>`;
}
// "1 unidentified ID track(s) ..." -> "1 unidentified ID track ..."
const tidyNote = t => String(t).replace(/\b(\d+)\b([^.()]*?)\(s\)/g, (m, n, mid) => n + mid + (Number(n) === 1 ? "" : "s"));
function renderSheetList(){
  const s = curSlot(); if(!s) return;
  const a = artistOf();
  const m = (a.sets || []).filter(x => !x.extra).length; // "in n of m sets" counts the sets the track lists were built from
  const q = sheetState.q.trim().toLowerCase();
  const match = k => (!q || k.toLowerCase().includes(q)) && (!krOnly || isKr(s.artist, k));
  const none = () => `<p class="empty">${q ? `nothing matches “${esc(sheetState.q)}”${krOnly ? " in your KR songs" : ""}.` : "no KR songs in this list yet. tap <b>KR</b> on a track."}</p>`;
  let h = "";
  if(a.note) h += `<p class="note">${esc(a.note)}</p>`;
  if(!hasData(a)){
    if(!a.note) h += `<p class="note">no tracklists from the last 12 months on 1001Tracklists for ${esc(s.artist)}. add the songs you're hoping for below.</p>`;
    h += mineBox(s.artist, () => true);
  } else if(sheetState.mode === "rel"){
    const list = (a.released || []).filter(it => match(keyOf(it)));
    const canGroup = (a.released || []).some(it => it.album && it.album.name);
    if(canGroup) h += `<div class="grpbar"><button class="tgl" id="grpRel" aria-pressed="${groupRel}">${groupRel ? "✓ " : ""}group by single / EP / album</button></div>`;
    h += !list.length ? none() : groupRel && canGroup ? releaseGroups(s.artist, list, m) : `<ul class="list">${list.map(it => relRow(s.artist, it, m)).join("")}</ul>`;
    h += `<p class="cap"><span class="c-ok">full tracks play from the official YouTube upload. 30s previews where there isn't one. <b>Spotify</b> plays here too: whole songs if you're signed in to Spotify in this browser, 30s if not.</span><span class="c-yt">full tracks can't play here, so these are 30s previews. full songs on Spotify.</span><span class="c-dz">full tracks play from the official YouTube upload. previews aren't loading right now, so the rest are on Spotify.</span><span class="c-no">playback isn't working here. full tracks are on Spotify.</span></p>`;
    h += mineBox(s.artist, match);
  } else if(sheetState.mode === "unrel"){
    const list = (a.unreleased || []).filter(it => match(keyOf(it)));
    h += list.length ? `<ul class="list">${list.map(it => unrelRow(s.artist, it, m)).join("")}</ul>` : none();
    if(a.own_note && !q && !krOnly) h += `<p class="cap own">${esc(tidyNote(a.own_note))}</p>`;
    else if(a.unknown_ids > 0 && !q && !krOnly) h += `<p class="more"><b>${a.unknown_ids}</b> more unidentified track${a.unknown_ids === 1 ? "" : "s"}</p>`;
    h += `<p class="cap">tap <b>clip</b> to watch or hear a posted clip right here. other clips are linked on the 1001Tracklists page.</p>`;
  } else {
    h += setsHtml(s.artist, a);
  }
  killYt();
  document.getElementById("sheetList").innerHTML = h;
  syncPlay(); syncSp();
  if(hasData(a) && sheetState.mode === "sets" && sheetState.openSet !== null){
    const si = sheetState.openSet, st = a.sets[si], c = sheetState.cue && sheetState.cue.si === si ? sheetState.cue : null;
    sheetState.cue = null;
    if(st && st.video) mountYt(si, c ? cueAt(st, c.ri) : null);
    if(c){ markNow(c.ri); seekRow(c.ri); }
  }
}
// released tracks grouped by the Spotify release they sit on, newest first
const REL_TYPE = {single:"Single", ep:"EP", album:"Album", compilation:"Compilation"};
function fmtRel(d){ const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(d || ""); return m ? (m[3] ? `${Number(m[3])} ` : "") + MON[Number(m[2]) - 1] + " " + m[1] : String(d || ""); }
function releaseGroups(artist, list, m){
  const groups = new Map();
  for(const it of list){
    // EPs and albums get their own heading; singles share one
    const al = it.album && it.album.name && it.album.type !== "single" ? it.album : null;
    const id = al ? (al.id || al.name) : it.album && it.album.name ? "single" : "~";
    if(!groups.has(id)) groups.set(id, { al, single: id === "single", items:[], date:"" });
    const g = groups.get(id); g.items.push(it);
    if((it.release_date || "") > g.date) g.date = it.release_date || "";
  }
  const rank = g => g.al ? 0 : g.single ? 1 : 2;
  const order = [...groups.values()].sort((x, y) => rank(x) - rank(y) || y.date.localeCompare(x.date) || y.items.length - x.items.length);
  for(const g of order) if(!g.al) g.items.sort((x, y) => (y.release_date || "").localeCompare(x.release_date || ""));
  return order.map(g => {
    const head = g.al
      ? `<div class="grp-h"><div><b>${esc(g.al.name)}</b><span>${esc(REL_TYPE[g.al.type] || "Release")}${g.date ? " · " + esc(fmtRel(g.date)) : ""} · ${plural(g.items.length, "track")} here</span></div>${g.al.id ? `<button class="act spb" data-spa="${esc(g.al.id)}" data-label="${esc(g.al.name)}" aria-pressed="false" aria-label="Play ${esc(g.al.name)} on Spotify, here">${IC.sp}play ${esc((REL_TYPE[g.al.type] || "release").toLowerCase())}</button>` : ""}</div>`
      : g.single ? `<div class="grp-h"><div><b>Singles</b><span>newest first · ${plural(g.items.length, "track")}</span></div></div>`
      : `<div class="grp-h"><div><b>Other tracks</b><span>release not matched yet</span></div></div>`;
    return `<section class="relgrp">${head}<ul class="list">${g.items.map(it => relRow(artist, it, m)).join("")}</ul></section>`;
  }).join("");
}
// update KR state in place so the list doesn't jump
function syncKr(){
  const s = curSlot(); if(!s) return;
  document.querySelectorAll("#sheet [data-kr]").forEach(b => {
    const k = isKr(s.artist, b.dataset.kr);
    b.setAttribute("aria-pressed", k);
    b.textContent = k ? "KR ✓" : "KR";
    const row = b.closest(".row, .tr"); if(row) row.classList.toggle("on", k);
  });
}

// ---------- player card ----------
function cardText(){
  const chosen = chosenSlots(); const bad = clashes();
  let out = `CHEF'S ${EDITION.code} PLAYER CARD · ${EDITION.dateLong} · ${EDITION.venue}\n`;
  out += `${plural(chosen.length, PICKS ? "set" : "act")} · ${totalKr()} kick rolls${TIMED ? "" : " · set times tba"}\n`;
  for(const s of chosen){
    out += TIMED ? `\n${s.start}-${s.end}  ${s.artist} (${STAGES[s.stage].name})\n` : `\n${s.artist} (${rowLabel(s)})\n`;
    const c = bad.get(slotId(s)); if(c) out += `   ! clashes with ${c.map(x=>x.artist).join(", ")}\n`;
    for(const t of krFor(s.artist)) out += `   KR  ${t}\n`;
  }
  return out;
}
function krItems(s){
  const ks = krFor(s.artist);
  return `<ul class="krlist">${ks.length ? ks.map(t=>{ const it = RELEASED.get(t); return `<li><span>${esc(t)}</span>${it?`<span class="ics"><button class="mini pv" data-play="${esc(t)}" aria-label="${esc(playLabel(t, playState(t)))}">${playInner(t, true)}</button>${it.sp?`<button class="mini" data-sp="${esc(t)}" aria-pressed="false" aria-label="Play ${esc(t)} on Spotify, here">${IC.sp}</button>`:it.spotify?`<a class="mini" href="${esc(it.spotify)}" target="_blank" rel="noopener" aria-label="Find ${esc(t)} on Spotify">${IC.sp}</a>`:""}</span>`:""}</li>`; }).join("") : `<li class="none">no KR songs yet. tap the name to pick some.</li>`}</ul>`;
}
function renderCard(){
  const chosen = chosenSlots();
  const bad = clashes();
  const now = nowMin();
  const nextIdx = !TIMED || now===null ? -1 : chosen.findIndex(s => s.s > now);
  const third = PICKS ? `<div class="stat ${bad.size?"bad":""}"><b>${bad.size}</b><span>clashes</span></div>` : `<div class="stat"><b>TBA</b><span>set times</span></div>`;
  let h = `<div class="pcard gframe"><div class="sheen" aria-hidden="true"></div><div class="pcard-head"><div><div class="eyebrow"><span class="star">★ P1</span> Player card <span class="sep">·</span> ${esc(EDITION.name)}</div><h2>${esc(EDITION.card)}</h2><div class="sub">${esc(EDITION.code)} · ${esc(EDITION.dateLong)} · ${esc(EDITION.venue)}</div></div>
    <div class="stats"><div class="stat"><b>${chosen.length}</b><span>${PICKS ? "sets" : "acts"}</span></div><div class="stat kr"><b>${totalKr()}</b><span>kick rolls</span></div>${third}</div></div><div class="thorn" aria-hidden="true"></div>`;
  if(!chosen.length){
    h += PICKS ? `<p class="empty" style="padding:20px 22px">nothing cooking yet. on the <b>quest board</b>, hit <b>+</b> on the sets you want, then tap each artist and KR the songs you'll kick roll to.</p>` : `<p class="empty" style="padding:20px 22px">the lineup isn't out yet.</p>`;
  } else if(!TIMED){
    // lineup mode: lineup order, no times, no clashes
    h += `<ol class="run">`;
    for(const s of chosen){
      h += `<li style="--c:${s.row === "head" ? "var(--gold-hi)" : "var(--p-magenta)"}"><div class="time">TBA<small>${esc(rowLabel(s))}</small></div><div>
        <div class="who"><button data-open="${esc(slotId(s))}">${esc(s.artist)}</button>${s.tag ? `<span class="st">${esc(s.tag)}</span>` : ""}</div>
        ${krItems(s)}
      </div></li>`;
    }
    h += `</ol>`;
  } else {
    h += `<ol class="run">`;
    chosen.forEach((s, i) => {
      const prev = chosen[i-1];
      if(prev && !bad.has(slotId(s))){
        const gap = s.s - prev.e;
        if(gap >= 15) h += `<li class="gap" aria-hidden="true"><b>${gap} min</b> free · ${fmt(prev.e)}–${s.start}</li>`;
        else if(prev.stage !== s.stage && gap >= 0) h += `<li class="gap" aria-hidden="true">Move to <b>${esc(STAGES[s.stage].name)}</b>${gap?` · ${gap} min`:" · no gap"}</li>`;
      }
      const c = bad.get(slotId(s));
      const live = now!==null && s.s <= now && now < s.e ? `<span class="live">on now</span>` : (i===nextIdx ? `<span class="live">up next</span>` : "");
      h += `<li style="--c:${stageColor(s.stage)}"><div class="time">${s.start}–${s.end}<small>${s.e-s.s} min</small></div><div>
        <div class="who"><button data-open="${esc(slotId(s))}">${esc(s.artist)}</button><span class="st">${esc(STAGES[s.stage].name)}</span>${live}</div>
        ${c?`<div class="clashnote">Clashes with ${c.map(x=>esc(x.artist)).join(", ")}</div>`:""}
        ${krItems(s)}
      </div></li>`;
    });
    h += `</ol>`;
  }
  h += `</div><div class="card-tools"><button class="btn primary" id="copyCard">Copy card</button><button class="btn" id="clearAll">reset everything</button></div><div id="copyFallback"></div>`;
  document.getElementById("cardWrap").innerHTML = h;
  syncPlay(); syncSp();
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 1800); }

// ---------- events ----------
let confirmReset = false;
function setTab(card){
  document.getElementById("tab-tt").setAttribute("aria-selected", !card);
  document.getElementById("tab-card").setAttribute("aria-selected", card);
  document.getElementById("view-tt").hidden = card; document.getElementById("view-card").hidden = !card;
  document.body.classList.toggle("on-card", card);
  renderMain();
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if(pick){ if(!PICKS) return; const id = pick.dataset.pick; picks.has(id) ? picks.delete(id) : picks.add(id); save(); renderHud(); if(sheetState.id) refreshHead(); else renderMain(); toast(picks.has(id) ? "locked in" : "dropped from your run"); return; }
  const open = e.target.closest("[data-open]");
  if(open){ openSheet(open.dataset.open, open); return; }
  const k = e.target.closest("[data-kr]");
  if(k){
    const s = curSlot(); const t = k.dataset.kr;
    toggleKr(s.artist, t);
    if(PICKS && isKr(s.artist,t) && !picks.has(sheetState.id)){ picks.add(sheetState.id); save(); renderHud(); refreshHead(); syncKr(); toast("KR saved. set locked in"); return; }
    if(krOnly && sheetState.mode !== "sets") renderSheetList(); else syncKr();
    return; }
  const wt = e.target.closest("[data-watch]");
  if(wt){ const [si, ri] = wt.dataset.watch.split(":").map(Number); watchAt(si, ri); return; }
  const sb = e.target.closest("[data-set]");
  if(sb){
    const si = Number(sb.dataset.set);
    sheetState.openSet = sheetState.openSet === si ? null : si; sheetState.cue = null;
    renderSheetList();
    const b = document.querySelector(`[data-set="${si}"]`); if(b) b.focus({preventScroll:true});
    if(sheetState.openSet === si){ const li = document.getElementById("set-" + si); if(li) li.scrollIntoView({block:"start", behavior: calm.matches ? "auto" : "smooth"}); }
    return; }
  const pl = e.target.closest("[data-play]");
  if(pl){ if(!pl.disabled) playTrack(pl.dataset.play); return; }
  if(e.target.closest("#npStop")){ closeNp(); return; }
  const spb = e.target.closest("[data-sp]");
  if(spb){ const it = RELEASED.get(spb.dataset.sp); if(it && it.sp) playSpotify("track", it.sp, spb.dataset.sp, spb.dataset.sp); return; }
  const spa = e.target.closest("[data-spa]");
  if(spa){ playSpotify("album", spa.dataset.spa, spa.dataset.label || "release", "album:" + spa.dataset.spa); return; }
  const clp = e.target.closest("[data-clip]");
  if(clp){ const k = clp.dataset.clip; clipOpen.has(k) ? clipOpen.delete(k) : clipOpen.add(k); renderSheet(true); return; }
  if(e.target.closest("#grpRel")){ groupRel = !groupRel; store.set("group", groupRel); renderSheetList(); const b = document.getElementById("grpRel"); if(b) b.focus({preventScroll:true}); return; }
  if(e.target.closest("#npToggle")){ if(fp.state === "playing" || fp.state === "loading") fullPause(); else fullResume(); return; }
  if(e.target.closest("#npFold")){
    fp.folded = !npEl.classList.contains("folded"); store.set("npfold", fp.folded);
    setFold(fp.folded); return; }
  if(e.target.closest("#npYt")){ fullPause(); return; }
  if(e.target.closest("#krOnly")){ krOnly = !krOnly; renderSheet(); return; }
  const del = e.target.closest("[data-del]");
  if(del){ const s = curSlot(); const t = del.dataset.del;
    custom[s.artist] = (custom[s.artist]||[]).filter(x => x!==t); if(!custom[s.artist].length) delete custom[s.artist];
    if(isKr(s.artist,t)) toggleKr(s.artist,t);
    save(); renderSheet(true); return; }
  const mode = e.target.closest("[data-mode]");
  if(mode){ sheetState.mode = mode.dataset.mode; renderSheet(); const t = document.getElementById("st-" + sheetState.mode); if(t) t.focus({preventScroll:true}); return; }
  const sw = e.target.closest("[data-view]");
  if(sw){ view = sw.dataset.view; store.set("view", view); renderSwitch(); renderTT(); return; }
  if(e.target.closest("#closeSheet") || e.target.id==="scrim"){ closeSheet(); return; }
  const tab = e.target.closest(".tab");
  if(tab){ setTab(tab.id==="tab-card"); return; }
  if(e.target.id==="copyCard"){
    const txt = cardText();
    const fb = () => { document.getElementById("copyFallback").innerHTML = `<textarea class="copybox" id="copyBox" readonly aria-label="Card text"></textarea>`; const b=document.getElementById("copyBox"); b.value = txt; b.focus(); b.select(); toast("copy blocked here. text is selected, copy it manually"); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast("card copied"), fb); }catch(err){ fb(); }
    return; }
  if(e.target.id==="clearAll"){
    if(!confirmReset){ confirmReset = true; e.target.textContent = "tap again to wipe it"; setTimeout(()=>{confirmReset=false; const b=document.getElementById("clearAll"); if(b) b.textContent="reset everything";}, 3000); return; }
    picks = new Set(); kr = {}; custom = {}; save(); confirmReset=false; renderAll(); toast("wiped clean"); return; }
});
document.addEventListener("input", e => { if(e.target.id==="trackSearch"){ sheetState.q = e.target.value; renderSheetList(); } });
document.addEventListener("submit", e => {
  if(e.target.id!=="addOwn") return; e.preventDefault();
  const v = document.getElementById("ownTrack").value.trim(); if(!v) return;
  const s = curSlot();
  if(!(custom[s.artist]||[]).includes(v)) custom[s.artist] = [...(custom[s.artist]||[]), v];
  save(); sheetState.q = ""; krOnly = false; renderSheet(true); const inp = document.getElementById("ownTrack"); if(inp) inp.focus({preventScroll:true}); toast("song added. tap KR to keep it");
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && sheetState.id){ closeSheet(); return; }
  const t = e.target.closest && e.target.closest('.seg [role="tab"]');
  if(t && (e.key==="ArrowRight" || e.key==="ArrowLeft")){
    const all = [...document.querySelectorAll('.seg [role="tab"]')];
    const nx = all[(all.indexOf(t) + (e.key==="ArrowRight" ? 1 : all.length - 1)) % all.length];
    e.preventDefault(); nx.click();
  }
});
const onNarrow = () => renderTT();
if(narrow.addEventListener) narrow.addEventListener("change", onNarrow); else if(narrow.addListener) narrow.addListener(onNarrow);
setInterval(() => { if(TIMED && nowMin()!==null && !sheetState.id) renderMain(); }, 60000);

function renderBoard(){ if(TIMED){ renderSwitch(); renderTT(); } else if(POSTER) renderPoster(); else renderLineup(); }
function renderMain(){
  if(!document.getElementById("view-tt").hidden) renderBoard();
  if(!document.getElementById("view-card").hidden) renderCard();
}
function renderAll(){ renderChrome(); renderBoard(); renderCard(); renderHud(); }
renderAll();
</script>
