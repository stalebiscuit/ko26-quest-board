<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chef's planner for EPIK 2026: the lineup, recent tracklists, kick roll picks.">
<meta name="theme-color" content="#14040a">
<title>Chef's EPIK26 Quest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Michroma&family=Cinzel:wght@500;700&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<script src="../ko-config.js"></script><script defer src="../ko-track.js"></script>
<style>
/* Layout: an RPG quest board, EPIK edition. Crimson-black chrome with Chef's gold item-frame corners around the EPIK lineup poster recreated in code (white type, thin white rules, white corner brackets, crimson smoke), artist sheet over the top, player card as the loot screen. Same components as the KO26 edition; only the palette and the main view change. When set times drop, the same poster flips to the KO26-style timetable (see the data mode switch). Single deliberate dark theme. */
:root{
  color-scheme: dark;
  /* chrome (Chef's gold, shared across editions, on crimson-black) */
  --bg:#0d0507;
  --panel:#180a0d;
  --panel-2:#1f0b0f;
  --line:#3f1b21;
  --fg:#f7eeea;
  --fg-2:#f0d9d2;
  --muted:#ab8d8d;
  --dim:#735458;
  --gold:#c9a84c;
  --gold-hi:#ffc85a;
  --blood:#a3271a;
  --blood-dk:#7c1f14;
  --violet:#c4161f;   /* edition glow (KO26: violet; EPIK: crimson) */
  --pink:#ff6b6b;
  --silver-1:#f5f7fa;
  --silver-2:#9aa1ab;
  --silver-3:#cfd4da;
  /* stage identity (defaults; per-stage colours come from data.stages when set times drop) */
  --arena:#ff8a8a;
  --pit:#ffc85a;
  --oasis:#f5f7fa;
  /* states */
  --kick:#ffc85a;
  --kick-ink:#1a1206;
  --warn:#ff9a3d;
  --rel:#72e6ad;
  --unrel:#ffb3b3;
  --scrim:rgba(8,2,4,.8);
  /* type */
  --blackletter:"Pirata One", "UnifrakturCook", "Old English Text MT", Georgia, serif;
  --edition:"Michroma", "Eurostile", "Arial", sans-serif;
  --rpg:"Cinzel", "Trajan Pro", Georgia, serif;
  --display:"Oswald", "Arial Narrow", system-ui, sans-serif;
  --poster:"Oswald", "Arial Narrow", "Impact", sans-serif;
  --pixel:"Silkscreen", "Courier New", ui-monospace, monospace;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Oswald", "Arial Narrow", system-ui, sans-serif;
  /* poster palette (EPIK crimson). Names kept from KO26 so the shared code works unchanged. */
  --p-bg:#14040a;
  --p-deep:#4d070d;
  --p-mid:#8e0d16;
  --p-glow:#c4161f;
  --p-block:#4a0810;
  --p-block-2:#560a13;
  --p-picked:#8e0d16;
  --p-ink:#ffffff;
  --p-soft:#ffcfcf;
  --p-frame:#ffffff;
  --p-violet:#c4161f;   /* glow colour */
  --p-magenta:#ff6b6b;  /* pale-red accent */
  --p-cyan:#ff8a8a;     /* ceremony strips */
  --p-amber:#ff8a8a;    /* emblem accents */
  --p-star:rgba(255,138,138,.55);
  --tap:44px;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background-color:var(--bg)}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 260px at 50% 0, color-mix(in srgb,var(--violet) 14%,transparent), transparent 80%),
    radial-gradient(ellipse 50% 40% at 100% 100%, color-mix(in srgb,var(--blood-dk) 18%,transparent), transparent 80%);
  background-repeat:no-repeat;background-attachment:scroll;
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}

/* gold pixel item-frame corners (stepped) */
.gframe{position:relative}
.gframe::before{content:"";position:absolute;inset:5px;pointer-events:none;z-index:2;--gc:var(--gold);
  background:
    linear-gradient(var(--gc),var(--gc)) left top/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left top/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px top 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px top 6px/3px 6px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right top/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right top/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px top 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px top 6px/3px 6px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left bottom/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left bottom/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px bottom 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) left 6px bottom 6px/3px 6px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right bottom/18px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right bottom/3px 18px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px bottom 6px/6px 3px no-repeat,
    linear-gradient(var(--gc),var(--gc)) right 6px bottom 6px/3px 6px no-repeat}
/* thorn divider: gold rule with a dagger-point diamond in the middle */
.thorn{position:relative;height:12px;margin:0;border:0}
.thorn::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent)}
.thorn::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:8px;transform:translate(-50%,-50%);background:var(--gold);clip-path:polygon(0 50%,40% 0,50% 50%,60% 0,100% 50%,60% 100%,50% 50%,40% 100%)}
/* reflective strip */
.sheen{height:4px;background:linear-gradient(100deg,var(--silver-2),var(--silver-1) 18%,var(--silver-2) 32%,var(--silver-3) 52%,var(--silver-1) 64%,var(--silver-2) 80%,var(--silver-3))}
.emblem{display:block;color:var(--fg)}

/* ---------- header / HUD ---------- */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px 24px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .emblem{width:118px;height:auto;flex:none}
.brand .txt{min-width:0}
.eyebrow{font-family:var(--rpg);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--gold)}
.eyebrow .sep{color:var(--dim)}
.brand h1{font-family:var(--blackletter);font-weight:400;font-size:clamp(32px,5.4vw,50px);line-height:1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance;color:var(--fg);
  text-shadow:0 0 14px color-mix(in srgb,var(--gold) 30%,transparent)}
.brand .cred{font-size:12.5px;color:var(--muted);margin-top:4px}
.brand .cred b{color:var(--fg-2);font-weight:600}
.hud{display:flex;gap:6px}
.hud .cell{min-width:68px;border:1px solid var(--line);background:var(--panel);padding:6px 10px 7px;text-align:center;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 12%,transparent)}
.hud .cell b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.hud .cell span{font-family:var(--rpg);font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.hud .cell.kr b{color:var(--gold-hi)}
.hud .cell.bad{border-color:var(--warn)}
.hud .cell.bad b{color:var(--warn)}
.top .thorn{grid-column:1/-1}

.tabs{grid-column:1/-1;display:flex;gap:4px;background:var(--panel);padding:4px;border:1px solid var(--line);justify-self:start}
.tab{white-space:nowrap;border:0;background:transparent;min-height:40px;padding:8px 18px;font-family:var(--rpg);font-weight:700;letter-spacing:.1em;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--gold)}
.count{font-family:var(--pixel);font-size:10px;background:var(--gold-hi);color:var(--kick-ink);padding:1px 6px}
.count.zero{background:var(--line);color:var(--muted)}

.hint{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;margin:14px 0 12px}
.hint b{color:var(--fg);font-weight:600}
.hint .k{font-family:var(--pixel);font-size:10px;background:var(--kick);color:var(--kick-ink);padding:0 5px}

/* ---------- stage switcher (phones) ---------- */
.switch{display:none}
.switch button{position:relative;border:1px solid var(--line);background:var(--panel);min-height:56px;padding:7px 8px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.switch .nm{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch .sb{font-family:var(--rpg);font-weight:700;font-size:9.5px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch button[data-view="all"]{--c:var(--fg);align-items:center;text-align:center}
.switch button .nm{color:var(--c)}
.switch button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel));box-shadow:inset 0 -3px 0 var(--c)}
.switch .pk{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;background:var(--c);color:var(--bg);font-family:var(--pixel);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- the poster: shared by the lineup board and the timetable ---------- */
.tt-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding:10px 8px 12px}
.tt,.lu{
  position:relative;color:var(--p-ink);
  background-color:var(--p-bg);
  background-image:
    radial-gradient(ellipse 70% 38% at 50% 12%, color-mix(in srgb,var(--p-glow) 62%,transparent), transparent 75%),
    radial-gradient(ellipse 90% 60% at 50% 40%, color-mix(in srgb,var(--p-mid) 55%,transparent), transparent 80%),
    radial-gradient(ellipse 120% 90% at 50% 50%, var(--p-deep), var(--p-bg) 85%);
  border:1px solid color-mix(in srgb,var(--p-frame) 14%,transparent);
}
.tt{display:grid;grid-template-columns:56px repeat(var(--cols,3),minmax(0,1fr)) 56px;column-gap:8px;padding:22px 10px 18px}
/* white corner brackets, as on the key art */
.tt::before,.lu::before{content:"";position:absolute;inset:-7px;pointer-events:none;--b:var(--p-frame);
  background:
    linear-gradient(var(--b),var(--b)) left top/30px 2px no-repeat,
    linear-gradient(var(--b),var(--b)) left top/2px 30px no-repeat,
    linear-gradient(var(--b),var(--b)) right top/30px 2px no-repeat,
    linear-gradient(var(--b),var(--b)) right top/2px 30px no-repeat,
    linear-gradient(var(--b),var(--b)) left bottom/30px 2px no-repeat,
    linear-gradient(var(--b),var(--b)) left bottom/2px 30px no-repeat,
    linear-gradient(var(--b),var(--b)) right bottom/30px 2px no-repeat,
    linear-gradient(var(--b),var(--b)) right bottom/2px 30px no-repeat}
.tt .notch-b{display:none}
.rule{grid-column:1/-1;height:1px;border:0;margin:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--p-frame) 70%,transparent) 15%,color-mix(in srgb,var(--p-frame) 70%,transparent) 85%,transparent)}
/* edition title: EPIK in Michroma, wide tracking */
.ed-title{grid-column:1/-1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
.ed-word{font-family:var(--edition);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:.32em;margin-right:-.32em;color:#fff;
  text-shadow:0 0 18px color-mix(in srgb,var(--p-glow) 90%,transparent),0 0 46px color-mix(in srgb,var(--p-glow) 70%,transparent)}
.ed-title .rule{width:min(420px,80%)}
.ed-date{font-family:var(--edition);font-size:clamp(16px,2.6vw,28px);letter-spacing:.24em;margin-right:-.24em;color:#fff}
.ed-sub{font-family:var(--display);font-weight:500;font-size:clamp(11px,1.4vw,14px);letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.ed-sub i{font-style:normal;color:var(--p-magenta);padding:0 .4em}


/* ---------- poster board (lineup mode + data.poster): HSU's own lineup poster, a clickable block over each act ---------- */
.lu.lu-poster{padding:0;gap:0;background:#0d0204}
.pz{position:relative;width:100%;container-type:inline-size;container-name:pz}
.pz img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.02);transition:background .15s,border-color .15s,box-shadow .15s}
.hs::before{content:"";position:absolute;inset:-4px;pointer-events:none;--b:rgba(255,255,255,.8);
  background:linear-gradient(var(--b),var(--b)) left top/10px 2px no-repeat,linear-gradient(var(--b),var(--b)) left top/2px 10px no-repeat,
    linear-gradient(var(--b),var(--b)) right top/10px 2px no-repeat,linear-gradient(var(--b),var(--b)) right top/2px 10px no-repeat,
    linear-gradient(var(--b),var(--b)) left bottom/10px 2px no-repeat,linear-gradient(var(--b),var(--b)) left bottom/2px 10px no-repeat,
    linear-gradient(var(--b),var(--b)) right bottom/10px 2px no-repeat,linear-gradient(var(--b),var(--b)) right bottom/2px 10px no-repeat}
.hs .open{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0;cursor:pointer}
@media (hover:hover){.hs:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.8)}}
.hs.picked{border:2px solid var(--gold-hi);background:color-mix(in srgb,var(--gold-hi) 12%,transparent);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 18px color-mix(in srgb,var(--gold-hi) 55%,transparent)}
.hs.picked::before{--b:var(--gold-hi)}
.hs .add{position:absolute;top:-1px;right:-1px;width:clamp(22px,4.2cqi,34px);height:clamp(22px,4.2cqi,34px);display:grid;place-items:center;padding:0;
  border:1px solid rgba(255,255,255,.7);background:rgba(10,2,4,.82);color:#fff;font-size:clamp(12px,2.2cqi,18px);line-height:1;transform:translate(35%,-35%);z-index:2}
.hs .add::after{content:"";position:absolute;inset:-8px}
.hs.picked .add{background:var(--gold-hi);border-color:var(--gold-hi);color:var(--kick-ink)}
.hs .badges{position:absolute;left:-1px;bottom:-1px;transform:translateY(55%);z-index:2}
.hs .badges .chip{font-size:clamp(9px,1.5cqi,12px)}
@container pz (max-width:620px){
  .hs{border-color:rgba(255,255,255,.22)}
  .hs::before{display:none}
  .hs .add{display:none}
  .hs.picked{border-width:2px}
  .hs .badges{left:auto;bottom:auto;right:-1px;top:-1px;transform:translate(20%,-60%)}
}
.lu-poster .p-hint{padding:12px 14px 14px;text-align:center;font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);border-top:1px solid rgba(255,255,255,.12)}

/* ---------- lineup board (mode "lineup": no set times yet) ---------- */
.lu{padding:30px clamp(14px,3vw,34px) 26px;display:flex;flex-direction:column;gap:20px}
.lu .ed-title{margin-bottom:4px}
.lu-lbl{text-align:center;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:var(--p-soft)}
.lu-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.lu .blk{position:relative;left:auto;right:auto;height:var(--h,104px);flex:0 1 calc((100% - 36px) / 4);min-width:0;
  background:linear-gradient(160deg,var(--p-block-2),var(--p-block) 70%);border:1px solid color-mix(in srgb,var(--p-frame) 22%,transparent)}
.lu .blk.alt{background:linear-gradient(200deg,var(--p-block-2),var(--p-block) 70%)}
.lu .blk.picked{background:linear-gradient(160deg,color-mix(in srgb,var(--p-picked) 80%,var(--p-glow)),var(--p-picked));border-color:var(--p-ink)}
.lu .blk .nm{font-size:22px}
.lu .blk .tg{white-space:normal;line-height:1.25;margin-top:3px}
.lu .blk .open{padding:6px 44px}
.lu .blk .add{width:44px;height:44px}
.lu .blk.head{--h:168px;flex-basis:100%}
.lu .blk.head .nm{font-size:clamp(36px,6.4vw,64px);letter-spacing:.03em}
.lu .blk.head .lvl{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.34em;margin-right:-.34em;color:var(--p-soft);text-transform:uppercase;margin-bottom:4px}
.lu .blk.head .wm svg{height:200px;right:4%;opacity:.2}
.lu-vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;border:1px solid color-mix(in srgb,var(--p-frame) 22%,transparent);background:color-mix(in srgb,var(--p-bg) 40%,transparent)}
.duel .blk{flex:none;border:0;--h:104px}
.duel .vs-x{display:flex;align-items:center;justify-content:center;padding:0 8px;font-family:var(--edition);font-size:13px;letter-spacing:.12em;color:var(--p-magenta);background:color-mix(in srgb,var(--p-bg) 55%,transparent);border-inline:1px solid color-mix(in srgb,var(--p-frame) 18%,transparent)}
.duel .blk .open{padding:6px 10px 6px 10px;padding-top:30px}
.duel .blk .add{right:0;top:0}
.duel .blk .badges{top:6px}
.lu-host{display:flex;justify-content:center}
.lu .blk.hostt{--h:72px;flex:0 1 320px}
.lu .blk.hostt .nm{font-size:24px}
.lu .blk.flat .open{cursor:default}
.lu .p-foot{margin-top:2px;border-top:0;padding-top:0}
.lu .p-foot small{display:block;font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.2em;color:var(--p-soft);margin-top:6px;text-transform:lowercase}
.p-title{grid-column:1/-1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px}
.p-title .emblem{width:min(400px,82%);height:auto}
.p-title .st{font-family:var(--rpg);font-weight:700;font-size:clamp(18px,2.6vw,26px);letter-spacing:.3em;text-transform:uppercase;padding:4px 0 4px .3em;border-block:1px solid var(--gold);color:var(--fg);min-width:min(260px,70%)}

.tt-head{text-align:center;padding:0 2px 10px;display:flex;flex-direction:column;align-items:center}
.tt-head .the{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.34em;padding:1px 0 1px .34em;border-block:1px solid var(--p-ink);min-width:62px}
.tt-head h2{margin:4px 0 0;font-family:var(--poster);font-weight:700;font-size:clamp(34px,4.6vw,54px);line-height:.92;text-transform:uppercase;letter-spacing:.01em;color:var(--p-ink)}
.tt-head .sub{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--p-soft);margin-top:6px}
.pre{background:var(--p-ink);color:var(--p-bg);font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:3px 4px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre:empty{visibility:hidden}

.axis{position:relative}
.axis span{position:absolute;font-family:var(--display);font-weight:700;font-size:20px;line-height:1;color:var(--p-ink);transform:translateY(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.axis span.half{font-size:12.5px;font-weight:500;color:var(--p-soft)}
.axis.l span{right:4px}
.axis.r span{left:4px}
.lane{position:relative}
.nowline{position:absolute;left:-4px;right:-4px;height:0;border-top:2px solid var(--kick);z-index:6;pointer-events:none;box-shadow:0 0 8px var(--kick)}
.nowline::before{content:"now";position:absolute;left:4px;top:-9px;font-family:var(--pixel);font-size:9px;background:var(--kick);color:var(--kick-ink);padding:1px 4px}

.blk{position:absolute;left:0;right:0;background:var(--p-block);z-index:1}
.blk.alt{background:var(--p-block-2)}
.blk .open{position:absolute;inset:0;border:0;background:transparent;padding:4px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;color:var(--p-ink)}
.blk.g-first .open{padding-top:18px}
.blk .nm{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;max-width:100%;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .nm sup{font-size:10px;font-weight:600;letter-spacing:.06em;margin-left:4px;vertical-align:6px;line-height:0}
.blk .tg{font-family:var(--display);font-weight:500;font-style:italic;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p-soft);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tm{font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.blk .vs{font-family:var(--mono);font-size:10.5px;color:var(--warn);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.short .tg,.blk.short .vs{display:none}
.blk.short .nm{display:block;white-space:nowrap;text-overflow:ellipsis}
.blk.short .open{gap:0}
.blk.tiny .tm{display:none}
@media (hover:hover){.blk:not(.picked) button.open:hover{background:color-mix(in srgb,var(--p-ink) 8%,transparent)}}
.blk .badges{position:absolute;left:5px;top:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none;z-index:2}
.blk.g-first .badges{top:22px}
.blk .badges .chip{margin:0}
.blk .add{position:absolute;right:0;top:0;width:40px;height:40px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;z-index:2}
.blk.g-first .add{top:16px}
.blk .add i{font-style:normal;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1.5px solid color-mix(in srgb,var(--p-ink) 70%,transparent);font-family:var(--display);font-weight:700;font-size:18px;line-height:1;color:var(--p-ink);background:color-mix(in srgb,var(--p-bg) 35%,transparent)}
@media (hover:hover){.blk:not(.picked) .add:hover i{background:var(--p-ink);color:var(--p-bg)}}
.blk.picked{z-index:3;background:var(--p-picked);box-shadow:0 0 0 2px var(--p-ink),0 0 0 4px color-mix(in srgb,var(--p-violet) 60%,transparent),0 0 22px color-mix(in srgb,var(--p-violet) 90%,transparent)}
.blk.picked .add i{background:var(--p-ink);color:var(--p-block);border-color:var(--p-ink);font-size:16px}
.blk.clash{box-shadow:0 0 0 2px var(--warn),0 0 0 4px color-mix(in srgb,var(--warn) 40%,transparent),0 0 20px color-mix(in srgb,var(--warn) 70%,transparent)}
.chip{display:inline-block;font-family:var(--pixel);font-size:9.5px;padding:0 5px;margin-left:6px;line-height:1.7}
.chip.kr{background:var(--kick);color:var(--kick-ink)}
.chip.cl{background:var(--warn);color:var(--kick-ink)}

.strip{position:absolute;left:0;right:0;background:var(--p-cyan);color:var(--p-bg);font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;z-index:2;white-space:nowrap;overflow:hidden;box-shadow:0 0 12px color-mix(in srgb,var(--p-cyan) 55%,transparent)}
.grp{position:absolute;left:-3px;right:-3px;border:1.5px solid var(--g);z-index:4;pointer-events:none;box-shadow:0 0 10px color-mix(in srgb,var(--g) 50%,transparent)}
.grp.gw{--g:var(--p-amber)}
.grp.bkjn{--g:var(--p-magenta)}
.grp .bn{position:absolute;left:0;right:0;top:0;height:16px;background:var(--g);color:var(--p-bg);font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}

.host{text-align:center;padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.host small{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.3em;color:var(--p-soft)}
.host b{font-family:var(--poster);font-weight:700;font-size:24px;letter-spacing:.04em;line-height:1}
.p-foot{grid-column:1/-1;text-align:center;font-family:var(--poster);font-weight:700;font-size:clamp(18px,2.8vw,30px);letter-spacing:.06em;line-height:1.15;text-transform:uppercase;margin-top:22px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--p-frame) 45%,transparent);text-wrap:balance}
.p-foot .dot{color:var(--gold)}

/* single-stage poster column on phones (renderTT only draws the chosen stage) */
.tt.single{grid-template-columns:40px minmax(0,1fr) 40px;column-gap:6px;padding-inline:6px}
.tt.phone:not(.single){min-width:calc(var(--cols,3) * 280px + 160px)}
.tt.single .axis span{font-size:16px}
.tt.single .axis span.half{font-size:11px}
.tt.single .blk .add{width:44px;height:44px}
.tt.single .blk.g-first .add{top:16px}
.tt.single .blk .open{padding-inline:44px}

/* ---------- artist emblems on the poster ---------- */
.blk .wm{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blk .wm svg{position:absolute;right:-8px;top:50%;height:min(calc(var(--h,80px) * 1.15),112px);width:auto;aspect-ratio:1/1;transform:translateY(-46%) rotate(-8deg);color:var(--p-soft);--acc:var(--p-amber);--sw:2.2;opacity:.16}
.blk.picked .wm svg{opacity:.24}
.blk .open{z-index:1;text-shadow:0 1px 3px color-mix(in srgb,var(--p-bg) 70%,transparent)}
.blk .nm .ic{display:inline-block;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--p-bg) 60%,transparent));width:1.08em;height:1.08em;vertical-align:-.2em;margin-right:.32em;color:var(--p-soft);--acc:var(--gold-hi);--sw:3.6;flex:none}
.blk.short .nm .ic{width:1em;height:1em}

/* ---------- artist sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{--c:var(--gold);padding:20px 20px 0;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--panel)),var(--panel-2));flex:none}
.sheet-head::before{inset:6px}
.pcard .thorn{margin:0 22px}
.sheet-head[data-stage="arena"]{--c:var(--arena)}
.sheet-head[data-stage="pit"]{--c:var(--pit)}
.sheet-head[data-stage="oasis"]{--c:var(--oasis)}
.sh-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.sh-em{width:88px;height:88px;flex:none;display:grid;place-items:center;color:var(--p-soft);--acc:var(--gold-hi);--sw:2.4;
  background:radial-gradient(circle at 50% 40%,var(--p-block-2),var(--p-bg) 95%);border:1px solid var(--gold);
  box-shadow:inset 0 0 0 3px var(--panel-2),inset 0 0 0 4px color-mix(in srgb,var(--gold) 40%,transparent),0 0 18px color-mix(in srgb,var(--p-violet) 35%,transparent)}
.sh-em svg{width:66px;height:66px}
.sh-id{min-width:0}
.sheet-head .stage{font-family:var(--rpg);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--c)}
.sheet-head h3{margin:3px 0 0;font-family:var(--blackletter);font-weight:400;font-size:40px;line-height:1;text-wrap:balance;overflow-wrap:anywhere;color:var(--fg)}
.sheet-head .when{font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--fg-2);margin-top:6px;font-variant-numeric:tabular-nums}
.sheet-head .when span{color:var(--muted)}
.x{align-self:start;border:1px solid var(--line);background:var(--bg);width:var(--tap);height:var(--tap);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.sh-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sh-clash{margin-top:10px;font-size:13.5px;color:var(--warn);display:flex;gap:8px;align-items:baseline}
.sh-clash .chip{margin:0;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);min-height:var(--tap);padding:8px 16px;font-family:var(--rpg);font-weight:700;font-size:14px;letter-spacing:.08em}
.btn.primary{background:var(--gold);color:var(--kick-ink);border-color:var(--gold-hi)}
.btn.picked{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border-color:var(--gold);color:var(--gold-hi)}
.btn.grow{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:16px -20px 0;border-top:1px solid var(--line)}
.seg button{border:0;background:transparent;min-height:54px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;padding:6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;text-wrap:balance}
.seg button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold);background:color-mix(in srgb,var(--gold) 6%,transparent)}
.seg .n{font-family:var(--pixel);font-size:10px;letter-spacing:0;color:var(--gold);text-transform:none}
.seg button[aria-selected="false"] .n{color:var(--dim)}
.sheet-body{overflow-y:auto;padding:16px 18px 48px;flex:1;overscroll-behavior:contain}
.filters{display:flex;gap:8px;align-items:stretch}
.search{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);min-height:var(--tap);padding:8px 12px;color:var(--fg);font:inherit;font-size:16px}
.search::placeholder,.addown input::placeholder{color:var(--dim)}
.kronly{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 12px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kronly .k{font-family:var(--pixel);font-size:10px;padding:0 4px;border:1px solid currentColor;line-height:1.6}
.kronly[aria-pressed="true"]{border-color:var(--kick);color:var(--kick);background:color-mix(in srgb,var(--kick) 10%,var(--panel))}
.kronly[aria-pressed="true"] .k{background:var(--kick);color:var(--kick-ink);border-color:var(--kick)}
.note{margin:0 0 14px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--panel);color:var(--fg-2);font-size:14px;line-height:1.5}
.cap{font-size:12.5px;color:var(--dim);margin:16px 2px 0;line-height:1.5}
.cap [class^="c-"]{display:none}
body:not(.yt-off):not(.dz-off) .cap .c-ok,body.yt-off:not(.dz-off) .cap .c-yt,body.dz-off:not(.yt-off) .cap .c-dz,body.yt-off.dz-off .cap .c-no{display:inline}
.cap.own{margin-top:12px}
.list{list-style:none;margin:10px 0 0;padding:0}
.row{padding:16px 6px 16px 12px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row.on{background:linear-gradient(90deg,color-mix(in srgb,var(--kick) 10%,transparent),transparent 70%);box-shadow:inset 3px 0 0 var(--kick)}
.r-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.r-t{min-width:0}
.r-t .ti{display:block;font-weight:600;font-size:16.5px;line-height:1.3;color:var(--fg);overflow-wrap:anywhere}
.r-t .ti.untitled{font-style:italic;font-weight:500;color:var(--fg-2)}
.r-t .ar{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:3px;overflow-wrap:anywhere}
.q{display:inline-block;font-family:var(--display);font-weight:500;font-size:12px;color:var(--dim);margin-left:5px;cursor:help}
.krb{min-width:58px;height:var(--tap);border:1.5px solid var(--line);background:transparent;font-family:var(--pixel);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0 8px}
@media (hover:hover){.krb[aria-pressed="false"]:hover{border-color:var(--kick);color:var(--kick)}}
.krb[aria-pressed="true"]{background:var(--kick);border-color:var(--kick);color:var(--kick-ink)}
.r-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border:1px solid var(--line);font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.04em;color:var(--fg-2);white-space:nowrap}
.pill.all{border-color:var(--gold);color:var(--gold-hi);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tip{font-size:13.5px;color:var(--muted);margin:2px 2px 14px}
.pill.kind{text-transform:uppercase;font-size:12px;letter-spacing:.06em;border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold-hi)}
.pill.kind.id{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.pill .qq{color:var(--muted);margin-left:2px}
.act{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.act svg{width:13px;height:13px;flex:none;color:var(--gold)}
@media (hover:hover){.act:not(:disabled):hover{border-color:var(--gold);color:var(--gold-hi)}}
.act.playing{background:var(--gold);border-color:var(--gold-hi);color:var(--kick-ink)}
.act.playing svg{color:var(--kick-ink)}
.act.busy{opacity:.75;cursor:progress}
.act:disabled{opacity:.5;cursor:default}
.act.paused{border-color:var(--gold);color:var(--gold-hi)}
.act .dur{font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.act.playing .dur{color:var(--kick-ink)}
.act .lc{text-transform:none}
.dz-off .pv:not(.ft){display:none}
.heard{flex-basis:100%;font-size:13.5px;color:var(--muted);line-height:1.45}
.heard a{color:var(--fg-2);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--gold) 60%,transparent);text-underline-offset:3px;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:16px 4px;line-height:1.6;margin:0}
.empty b{color:var(--fg)}
.lnk{border:0;background:none;padding:0;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;font:inherit;min-height:32px}
.sets{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.set{border:1px solid var(--line);background:var(--panel)}
.set.open{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:var(--panel-2)}
.set-h{width:100%;border:0;background:transparent;text-align:left;padding:13px 12px 8px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;color:var(--fg)}
.set-dt{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.set-ev{grid-column:1;font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.set-meta{grid-column:1;display:flex;flex-wrap:wrap;gap:0 10px;font-family:var(--display);font-size:13px;letter-spacing:.04em;color:var(--muted)}
.set-meta .vid{display:inline-flex;align-items:center;gap:5px;color:var(--fg-2)}
.set-meta svg{width:13px;height:13px;color:var(--gold)}
.chev{grid-column:2;grid-row:1/span 3;width:34px;height:34px;border:1px solid var(--line);display:grid;place-items:center;background:var(--bg)}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:translateY(-2px) rotate(45deg)}
.set.open .chev::before{transform:translateY(2px) rotate(-135deg)}
@media (hover:hover){.set-h:hover .chev{border-color:var(--gold)}}
.set-f{padding:0 14px 12px;font-size:13px}
.set-f a,.novid a,.src{color:var(--fg-2);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--gold) 60%,transparent);text-underline-offset:3px}
.set-b{border-top:1px solid var(--line)}
.yt{position:sticky;top:-16px;z-index:3;background:var(--bg);padding:0;aspect-ratio:16/9;width:100%}
.yt iframe{display:block;width:100%;height:100%;border:0;background:#000}
.yt-cap{margin:0;padding:8px 14px;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--line)}
.novid{margin:0;padding:12px 14px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.tl{list-style:none;margin:0;padding:0}
.tr{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:4px 10px;padding:11px 10px 11px 12px;border-top:1px solid var(--line);align-items:start}
.tl .tr:first-child{border-top:0}
.tr .no{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.3;color:var(--fg-2);font-variant-numeric:tabular-nums;padding-top:1px}
.tr .no small{display:block;font-weight:500;font-size:11.5px;letter-spacing:.02em;color:var(--muted)}
.tr.w{margin-left:16px;padding-left:10px;border-top-style:dashed;box-shadow:inset 2px 0 0 color-mix(in srgb,var(--gold) 40%,transparent)}
.tr.w .no{color:var(--gold)}
.tr .tx{min-width:0}
.tr .ti{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.tr .ti.unid{font-style:italic;font-weight:500;color:var(--dim)}
.tr .ar{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.tr .ts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.tr .ts:empty{display:none}
.tr .krb{min-width:52px;height:40px}
.tr.on{background:linear-gradient(90deg,color-mix(in srgb,var(--kick) 10%,transparent),transparent 70%);box-shadow:inset 3px 0 0 var(--kick)}
.tr[aria-current="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--p-violet) 22%,transparent),transparent 80%);box-shadow:inset 3px 0 0 var(--p-violet)}
.tr[aria-current="true"] .no small{color:var(--fg)}
.rchip{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 7px;border:1px solid currentColor;font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-decoration:none;line-height:1}
.rchip.rel{color:var(--rel);background:color-mix(in srgb,var(--rel) 8%,transparent)}
.rchip.rel span{color:var(--fg-2);text-transform:none;letter-spacing:.02em;font-weight:500}
.rchip.un{color:var(--unrel);background:color-mix(in srgb,var(--unrel) 8%,transparent)}
@media (hover:hover){a.rchip:hover{background:color-mix(in srgb,var(--rel) 20%,transparent)}}
.watch{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.watch svg{width:14px;height:14px;flex:none;color:var(--gold)}
@media (hover:hover){.watch:hover{border-color:var(--gold);color:var(--gold-hi)}}
.r-sub .watch{min-height:38px}
.tr .rc{display:flex;flex-direction:column;gap:6px}
.tr .rc .mini{width:auto;height:34px}
.brk{flex-basis:100%;height:0}
.dz-off .tr .rc .mini:not(.ft){display:none}
.src{font-size:13.5px;white-space:nowrap}
.chk{flex-basis:100%;font-size:12px;color:var(--dim);letter-spacing:.01em}
.box{border:1px solid var(--line);background:var(--panel);margin-top:22px}
.box-h{padding:12px 14px;border-bottom:1px solid var(--line)}
.box-h b{display:block;font-family:var(--rpg);font-weight:700;font-size:13.5px;letter-spacing:.06em;color:var(--fg-2)}
.box-h span{font-size:13px;color:var(--muted)}
.box .list{margin:0}
.box .row{padding-right:6px}
.mine .r-main{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.del{border:1px solid transparent;background:transparent;color:var(--dim);width:var(--tap);height:var(--tap);font-size:20px}
.del:hover{color:var(--warn)}
.addown{display:flex;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.addown input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);min-height:var(--tap);padding:8px 12px;color:var(--fg);font:inherit;font-size:16px}

/* ---------- now playing ---------- */
.np{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));z-index:30;background:var(--panel-2);border:1px solid var(--gold);box-shadow:0 8px 28px var(--scrim)}
.np-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 14px}
.np-eq{display:flex;gap:2px;align-items:flex-end;height:16px;width:16px}
.np-eq i{flex:1;background:var(--gold-hi);height:60%}
.np-eq i:nth-child(2){height:100%}.np-eq i:nth-child(3){height:40%}

.card-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:16px;max-width:760px}

<script>
// ===== edition config: the only JS to change when copying this board for another rave =====
const EDITION = {
  ns: "epik26:",                    // localStorage prefix, one per edition (KO26 uses "ko26.")
  code: "EPIK26",
  name: "EPIK",
  day: "2026-12-12",                // festival day (Sydney time) for the "now" line and on now / up next
  dateLong: "Sat 12 Dec 2026",
  dateShort: "12.12.26",
  venue: "Sydney Showground",
  tagline: "the finale",
  card: "chef's run"
};
// header logo: 1, 2, 3 or 4
const LOGO = 1;
let DATA = null;
try{ DATA = JSON.parse(document.getElementById("ko-data").textContent); }catch(e){ DATA = null; }
document.querySelectorAll("use[data-logo]").forEach(u => u.setAttribute("href", "#logo" + LOGO));

// Stages only matter in timetable mode. They come from data.stages once set times are out.
const STAGES = (DATA && DATA.stages && Object.keys(DATA.stages).length) ? DATA.stages : {
  main:{name:"Main Stage", word:"Main", short:"Main", sub:"", host:"Villain", color:"#ff8a8a"}
};
const DAY = EDITION.day;
// lineup rows (mode "lineup")
const ROWS = { head:"headliner", alpha:"in alphabetical order", battle:"battle", host:"hosted by" };

// ---------- state ----------
const NS = EDITION.ns;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS + k, JSON.stringify(v)); }catch(e){} }
};
let picks = new Set(store.get("picks", []));
let kr = store.get("kr", {});          // { artist: [trackText,...] }
let custom = store.get("custom", {});  // { artist: [trackText,...] } songs added by hand
const save = () => { store.set("picks",[...picks]); store.set("kr",kr); store.set("custom",custom); };

const toMin = t => { const [h,m] = t.split(":").map(Number); return (h < 12 ? h+12 : h)*60 + m; };
const fmt = m => { const h = Math.floor(m/60), mm = m%60; const hh = h>12 ? h-12 : h; return hh + ":" + String(mm).padStart(2,"0"); };
const rawSlots = (DATA && DATA.slots) || [];
// data.mode: "lineup" (no set times: lineup poster) or "timetable" (KO26-style set-times poster).
// Missing mode: timetable as soon as any slot has a start time.
const MODE = (DATA && (DATA.mode === "lineup" || DATA.mode === "timetable")) ? DATA.mode : (rawSlots.some(s => s.start && s.end) ? "timetable" : "lineup");
const TIMED = MODE === "timetable";
const slots = rawSlots.map((s, i) => ({...s, i, s: s.start ? toMin(s.start) : null, e: s.end ? toMin(s.end) : null}))
  .filter(s => TIMED ? (s.s !== null && s.e !== null && STAGES[s.stage]) : !s.special);
const slotId = s => TIMED ? s.stage + ":" + s.artist : s.artist;
// Single-stage raves (and the lineup before set times): no lock-in, the player card is every act on the lineup.
// Only a multi-stage timetable keeps picks and clash checks.
const PICKS = TIMED && Object.keys(STAGES).length > 1;
const ARTISTS = (DATA && DATA.artists) || {};
const hasData = a => !!(a && a.sets && a.sets.length);
// poster board: lineup mode with HSU's poster and a box on every slot
const POSTER = (DATA && DATA.poster && DATA.poster.src && rawSlots.length && rawSlots.every(s => Array.isArray(s.box) && s.box.length === 4)) ? DATA.poster : null;
// MCs and hosts (row "host" or host:true) aren't clickable, have no song sheet and aren't on the player card
const isHost = s => s.row === "host" || !!s.host;
const isFlat = s => !TIMED && (!!s.flat || isHost(s));
const acts = slots.filter(s => !s.special && !isFlat(s));
// poster scale: from the first hour with a real set to the last finish
const START = TIMED && acts.length ? Math.floor(Math.min(...acts.map(s=>s.s))/60)*60 : 15*60;
const END = TIMED && slots.length ? Math.ceil(Math.max(...slots.map(s=>s.e))/60)*60 : 23*60;
const narrow = window.matchMedia("(max-width:760px)");
let view = store.get("view", Object.keys(STAGES)[0]); // phone lane: a stage key | all
if(!(view in STAGES) && view !== "all") view = Object.keys(STAGES)[0];
// picks survive the lineup -> timetable flip: re-key anything that no longer matches by artist name
(function migratePicks(){
  const ids = new Set(acts.map(slotId)); let changed = false;
  for(const p of [...picks]){
    if(ids.has(p)) continue;
    const nm = p.includes(":") ? p.slice(p.indexOf(":") + 1) : p;
    const t = acts.find(x => x.artist === nm);
    if(t){ picks.delete(p); picks.add(slotId(t)); changed = true; }
  }
  if(changed) save();
})();

const krFor = a => kr[a] || [];
const isKr = (a,t) => krFor(a).includes(t);
function toggleKr(a,t){
  const list = krFor(a).slice(); const i = list.indexOf(t);
  if(i>=0) list.splice(i,1); else list.push(t);
  if(list.length) kr[a] = list; else delete kr[a];
  save(); renderHud();
}
const chosenSlots = () => acts.filter(s => !PICKS || picks.has(slotId(s))).sort((a,b) => TIMED ? (a.s-b.s || a.stage.localeCompare(b.stage)) : a.i-b.i);
// clash logic only runs in timetable mode
function clashes(){
  const bad = new Map();
  if(!PICKS) return bad;
  const chosen = chosenSlots();
  for(const a of chosen) for(const b of chosen){
    if(a===b) continue;
    if(a.s < b.e && b.s < a.e){ if(!bad.has(slotId(a))) bad.set(slotId(a), []); bad.get(slotId(a)).push(b); }
  }
  return bad;
}
// picked sets on other stages that overlap a slot
const overlapsPick = s => PICKS ? chosenSlots().filter(p => p.stage!==s.stage && p.s < s.e && s.s < p.e) : [];
const totalKr = () => chosenSlots().reduce((n,s)=>n+krFor(s.artist).length,0);
const isId = t => /^ID\s*-\s*ID/i.test(t) || /^ID$/i.test(t.trim());
function splitTrack(t){ const i = t.indexOf(" - "); return i>0 ? [t.slice(0,i), t.slice(i+3)] : ["", t]; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const stageColor = k => (STAGES[k] && STAGES[k].color) || "var(--gold)";
const rowLabel = s => s.row === "battle" && s.vs ? `battle · vs ${s.vs}` : (ROWS[s.row] || "lineup");

// Sydney clock, only on festival day. window.KO_NOW (minutes after midnight) overrides for testing.
function nowMin(){
  if(typeof window.KO_NOW === "number") return window.KO_NOW;
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    if(`${p.year}-${p.month}-${p.day}` !== DAY) return null;
    return Number(p.hour)*60 + Number(p.minute);
  }catch(e){ return null; }
}

// ---------- static copy that depends on the mode ----------
function renderChrome(){
  document.getElementById("hint").innerHTML = TIMED
    ? `<span><b>tap a set</b> for its tracks</span>${PICKS ? `<span><b>+</b> locks it into your run</span>` : ""}<span class="wide"><span class="k">KR</span> = a song you'll kick roll to</span><span>all times pm</span>`
    : `<span><b>tap an act</b> for its tracks</span><span class="wide"><span class="k">KR</span> = a song you'll kick roll to</span><span>set times not out yet</span>`;
  document.getElementById("ttScroll").hidden = !TIMED;
  document.getElementById("lu").hidden = TIMED;
  document.getElementById("switch").hidden = !TIMED;
  document.getElementById("hudClashLbl").textContent = PICKS ? "clashes" : TIMED ? "stage" : "set times";
  document.getElementById("hudSetsLbl").textContent = PICKS ? "sets" : "acts";
  document.getElementById("foot").innerHTML = (TIMED ? `set times from HSU Events' official ${esc(EDITION.name)} timetable. ` : `lineup from HSU Events' official ${esc(EDITION.name)} 2026 poster. set times aren't out yet, so the board shows the lineup for now. `)
    + `tracklists from 1001Tracklists: each act's sets from the last 12 months, as IDed by the community, so an ${esc(EDITION.name)} set may differ. full tracks play from Spotify and the official YouTube uploads, with 30s Deezer previews where there isn't one. set videos are the recordings linked on 1001Tracklists, and cue times are community-added, so they can be a little out. ${POSTER ? "lineup poster and artist logos belong to HSU Events and the artists; sheet emblems are original artwork." : "emblems are original artwork, not official artist logos."} KR songs are saved in this browser only, so hit <b>Copy card</b> to keep a backup.`;
}

// ---------- HUD ----------
function renderHud(){
  const n = chosenSlots().length, k = totalKr(), c = clashes().size;
  document.getElementById("hudSets").textContent = n;
  document.getElementById("hudKr").textContent = k;
  document.getElementById("hudClash").textContent = PICKS ? c : TIMED ? Object.keys(STAGES).length : "TBA";
  document.getElementById("hudClashCell").classList.toggle("bad", c>0);
  const el = document.getElementById("krCount"); el.textContent = k; el.classList.toggle("zero", !k);
}

// ---------- stage switcher (phones, timetable mode) ----------
function renderSwitch(){
  if(!TIMED) return;
  const chosen = chosenSlots();
  const K = Object.keys(STAGES);
  let h = "";
  for(const k of K){
    const n = chosen.filter(s=>s.stage===k).length;
    h += `<button data-view="${esc(k)}" aria-pressed="${view===k}" style="--c:${stageColor(k)}"><span class="nm">${esc(STAGES[k].short || STAGES[k].word || k)}</span><span class="sb">${esc(STAGES[k].sub || "")}</span>${n?`<span class="pk" aria-label="${n} picked">${n}</span>`:""}</button>`;
  }
  if(K.length > 1) h += `<button data-view="all" aria-pressed="${view==="all"}" aria-label="All stages side by side"><span class="nm">All</span></button>`;
  const sw = document.getElementById("switch");
  sw.style.gridTemplateColumns = K.length > 1 ? `repeat(${K.length},minmax(0,1fr)) 52px` : "minmax(0,1fr)";
  sw.innerHTML = h;
}

// ---------- shared poster bits ----------
// compact edition title (the key art lives on the landing card)
function edTitle(label){
  return `<div class="ed-title"><div class="ed-word">${esc(EDITION.name)}</div><hr class="rule"><div class="ed-sub">${esc(label)}<i>·</i>${esc(EDITION.dateShort)}</div></div>`;
}
function parseTag(tag){
  const out = {group:null, sups:[], sub:""}; const subs = [];
  for(const p of String(tag||"").split(/\s*·\s*/).filter(Boolean)){
    if(/get wrecked/i.test(p)) out.group = {key:"gw", label:p};
    else if(/bkjn/i.test(p)) out.group = {key:"bkjn", label:p};
    else if(/^live$/i.test(p)) out.sups.push("Live");
    else if(/^ft\.?\s/i.test(p)) out.sups.push(p);
    else subs.push(p.replace(/\s+live$/i, " · Live"));
  }
  out.sub = subs.join(" · ");
  return out;
}
const dash = (a,b) => `${a} - ${b}`;

// ---------- poster board (lineup mode + data.poster) ----------
function renderPoster(){
  const lu = document.getElementById("lu"), P = POSTER;
  lu.classList.add("lu-poster");
  const pct = (v, of) => (v / of * 100).toFixed(3) + "%";
  const boxes = slots.filter(s => !s.special && !isFlat(s)).map(s => {
    const [x, y, w, h] = s.box, id = slotId(s), n = krFor(s.artist).length;
    const label = `${s.artist}${s.tag ? ", " + s.tag : ""}${s.vs ? ", battle versus " + s.vs : ""}`;
    return `<div class="hs" style="left:${pct(x, P.w)};top:${pct(y, P.h)};width:${pct(w, P.w)};height:${pct(h, P.h)}">
      <button class="open" data-open="${esc(id)}" aria-label="${esc(label)}. Show tracks"></button>
      ${n ? `<span class="badges"><span class="chip kr">${n} KR</span></span>` : ""}
    </div>`;
  }).join("");
  lu.innerHTML = `<div class="pz"><img src="${esc(P.src)}" alt="${esc(P.alt || EDITION.name + " lineup")}" width="${P.w}" height="${P.h}">${boxes}</div>
    <div class="p-hint">set times tba · tap any act for its recent tracks</div>`;
}
// ---------- lineup board (mode "lineup") ----------
function tile(s, cls){
  const id = slotId(s), on = PICKS && picks.has(id), n = krFor(s.artist).length, t = parseTag(s.tag);
  const flat = isFlat(s);
  const name = `<span class="nm">${emSvg(s.artist, "ic")}${esc(s.artist)}${t.sups.map(x=>`<sup>${esc(x)}</sup>`).join("")}</span>${t.sub?`<span class="tg">${esc(t.sub)}</span>`:""}`;
  const lvl = s.row === "head" ? `<span class="lvl">headliner</span>` : "";
  return `<div class="blk ${cls}${on?" picked":""}${flat?" flat":""}">
    ${hasEm(s.artist) ? `<span class="wm" aria-hidden="true">${emSvg(s.artist, "")}</span>` : ""}
    ${flat ? `<div class="open">${name}</div>` : `<button class="open" data-open="${esc(id)}" aria-label="${esc(s.artist)}${s.tag ? ", " + esc(s.tag) : ""}. Show tracks">${lvl}${name}</button>`}
    ${n?`<span class="badges"><span class="chip kr">${n} KR</span></span>`:""}
  </div>`;
}
function renderLineup(){
  const lu = document.getElementById("lu");
  const by = r => slots.filter(s => s.row === r);
  let h = edTitle("full lineup");
  h += `<hr class="rule">`;
  for(const s of by("head")) h += `<div class="lu-row">${tile(s, "head")}</div>`;
  const alpha = by("alpha");
  if(alpha.length) h += `<div class="lu-lbl">${ROWS.alpha}</div><div class="lu-row">${alpha.map((s,i) => tile(s, i%2 ? "alt" : "")).join("")}</div>`;
  const bat = by("battle"), used = new Set(), duels = [];
  for(const s of bat){
    if(used.has(s)) continue; used.add(s);
    const o = bat.find(x => !used.has(x) && x.artist === s.vs);
    if(o) used.add(o);
    duels.push(o ? [s, o] : [s]);
  }
  if(duels.length){
    h += `<hr class="rule"><div class="lu-lbl">battles</div><div class="lu-vs">`;
    for(const d of duels) h += `<div class="duel" role="group" aria-label="${esc(d.map(x=>x.artist).join(" versus "))}">${tile(d[0], "")}${d[1] ? `<span class="vs-x" aria-hidden="true">VS</span>${tile(d[1], "alt")}` : ""}</div>`;
    h += `</div>`;
  }
  const host = by("host");
  if(host.length) h += `<hr class="rule"><div class="lu-lbl">${ROWS.host}</div><div class="lu-host">${host.map(s => tile(s, "hostt")).join("")}</div>`;
  const other = slots.filter(s => !ROWS[s.row]);
  if(other.length) h += `<div class="lu-row">${other.map(s => tile(s, "")).join("")}</div>`;
  h += `<hr class="rule"><div class="p-foot">${esc(EDITION.name)} <span class="dot">·</span> ${esc(EDITION.dateShort)} <span class="dot">·</span> ${esc(EDITION.venue)}<small>set times tba · tap any act for its recent tracks</small></div>`;
  lu.innerHTML = h;
}

// ---------- timetable: set-times poster (mode "timetable") ----------
function renderTT(){
  if(!TIMED) return;
  const tt = document.getElementById("tt");
  const ALL = Object.keys(STAGES);
  const single = narrow.matches && view !== "all" && ALL.length > 1 || (narrow.matches && ALL.length === 1);
  const K = narrow.matches && view !== "all" && STAGES[view] ? [view] : ALL;
  tt.classList.toggle("single", single);
  tt.classList.toggle("phone", narrow.matches);
  tt.style.setProperty("--cols", K.length);
  const px = (single ? 140 : 120) / 60, OFF = 12;
  const H = (END-START)*px + OFF*2;
  const bad = clashes();
  const now = nowMin();
  const Y = m => (m-START)*px + OFF;
  let h = edTitle("set times");
  h += `<div class="corner"></div>`;
  for(const k of K) h += `<div class="tt-head" data-stage="${esc(k)}"><div class="the">The</div><h2>${esc(STAGES[k].word || STAGES[k].name)}</h2><div class="sub">${esc(STAGES[k].sub || "")}</div></div>`;
  h += `<div class="corner"></div><div class="corner"></div>`;
  for(const k of K){
    const pre = slots.filter(x => x.stage===k && x.special && x.e <= START);
    h += `<div class="pre" data-stage="${esc(k)}">${pre.map(x=>`${esc(x.artist)} ${dash(x.start,x.end)}`).join(" · ")}</div>`;
  }
  h += `<div class="corner"></div>`;
  const axis = side => {
    let a = `<div class="axis ${side}" style="height:${H}px" aria-hidden="true">`;
    for(let m=START; m<=END; m+=30) a += `<span class="${m%60?"half":""}" style="top:${Y(m)}px">${fmt(m)}</span>`;
    return a + `</div>`;
  };
  h += axis("l");
  for(const k of K){
    h += `<div class="lane" data-stage="${esc(k)}" style="height:${H}px">`;
    if(now!==null && now>=START && now<=END) h += `<div class="nowline" style="top:${Y(now)}px"></div>`;
    const lane = slots.filter(x => x.stage===k && x.e > START).sort((a,b)=>a.s-b.s);
    // banner groups from tags
    const groups = []; let cur = null;
    for(const s of lane){
      const g = s.special ? null : parseTag(s.tag).group;
      if(g && cur && cur.key===g.key && s.s <= cur.e){ cur.e = s.e; cur.items.push(s); }
      else if(g){ cur = {key:g.key, label:g.label, s:s.s, e:s.e, items:[s]}; groups.push(cur); }
      else cur = null;
    }
    const firsts = new Set(groups.map(g => g.items[0]));
    let i = 0;

// ---------- tracks ----------
const keyOf = it => `${it.artist} - ${it.title}`;
const RELEASED = new Map(); // "Artist - Title" -> released item, across every act
for(const a of Object.values(ARTISTS)) for(const it of (a.released || [])){ const k = keyOf(it); if(!RELEASED.has(k)) RELEASED.set(k, it); }
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "2025-12-13" -> "Sat 13 Dec 2025"
function fmtDay(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); if(!m) return d || "";
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay()];
  return `${wd} ${Number(m[3])} ${MON[Number(m[2]) - 1]} ${m[1]}`;
}
// seconds -> m:ss or h:mm:ss
function fmtCue(sec){
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
}
const SRC = {deezer:"Deezer", soundcloud:"SoundCloud", youtube:"YouTube"};
const srcName = k => SRC[k] || k;
// a null first cue means the song starts the recording
function cueAt(st, ri){
  if(!st || !st.cues) return null;
  const c = st.cues[ri];
  return typeof c === "number" ? c : (ri === 0 ? 0 : null);
}
const setOrder = a => (a.sets || []).map((_, i) => i).sort((x, y) => String(a.sets[y].date || "").localeCompare(String(a.sets[x].date || "")) || x - y);
// per act: look a set row up in its released / unreleased lists, and find the newest set video for each song
const IDX = new Map();
function actIndex(name){
  if(IDX.has(name)) return IDX.get(name);
  const a = ARTISTS[name] || {};
  const by = new Map();
  const put = (it, rel) => { const k = keyOf(it); for(const x of [k, k.toLowerCase()]) if(!by.has(x) || rel) by.set(x, {key:k, it, rel}); };
  for(const it of (a.unreleased || [])) put(it, false);
  for(const it of (a.released || [])) put(it, true);
  const find = t => by.get(t) || by.get(String(t).toLowerCase()) || null;
  const watch = new Map(); // key -> {si, ri, cue}
  for(const si of setOrder(a)){
    const st = a.sets[si]; if(!st.video || !st.tracks) continue;
    st.tracks.forEach(([, t], ri) => {
      if(isId(t)) return;
      const c = cueAt(st, ri); if(c === null) return;
      const f = find(t), k = f ? f.key : t;
      if(!watch.has(k)) watch.set(k, {si, ri, cue:c});
    });
  }
  const out = {find, watch};
  IDX.set(name, out);
  return out;
}

// ---------- set videos: YouTube embed, IFrame API when it loads, plain src reload when it doesn't ----------

function ytSrc(id, start){
  let u = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?enablejsapi=1&playsinline=1&rel=0`;
  if(/^https?:$/.test(location.protocol)) u += "&origin=" + encodeURIComponent(location.origin);

}

// follow the video: light up the song that's playing
function trackTimer(){
  clearInterval(yt.timer);
  yt.timer = setInterval(() => {
    if(!yt.player || !yt.ready || !yt.frame || !yt.frame.isConnected){ clearInterval(yt.timer); return; }
    let t; try{ t = yt.player.getCurrentTime(); }catch(e){ return; }
    if(typeof t !== "number") return;
    const st = (artistOf().sets || [])[yt.si]; if(!st || !st.tracks) return;
    let best = -1;
    st.tracks.forEach((_, i) => { const c = cueAt(st, i); if(c !== null && c <= t + 1) best = i; });
    if(best >= 0) markNow(best);
  }, 1500);
}

// jump the set video to a song; opens the set card first if needed
function watchAt(si, ri){
  const a = artistOf(), st = (a.sets || [])[si];
  const cue = cueAt(st, ri); if(!st || !st.video || cue === null) return;

    else { sheetState.openSet = si; renderSheetList(); }

  }
  markNow(ri);
  if(yt.player && yt.ready){
    try{ yt.player.seekTo(cue, true); yt.player.playVideo(); return; }catch(e){}
  }
  yt.frame.src = ytSrc(st.video.id, cue);
}

function bindFull(){

const audio = document.getElementById("audio");
const dz = { off:false, cache:new Map(), cur:null, want:null, n:0, endT:0 };
// cache: key -> {s:"busy"} | {s:"ok", url} | {s:"none"}
const dzQuery = it => `${it.artist} ${it.title}`.replace(/\s+(ft\.?|feat\.?|vs\.?|&)\s+/gi, " ").replace(/[()[\]]/g, " ").replace(/\s+/g, " ").trim();
function dzLookup(it){
  return new Promise(resolve => {
    const cb = "epDz" + (++dz.n) + "_" + Date.now().toString(36);
    const sc = document.createElement("script");
    let done = false, t = 0;
    const finish = v => { if(done) return; done = true; clearTimeout(t); window[cb] = function(){}; sc.remove(); resolve(v); };
    t = setTimeout(() => finish({s:"none"}), 6000);
    window[cb] = res => { const p = res && res.data && res.data[0] && res.data[0].preview; finish(p ? {s:"ok", url:p} : {s:"none"}); };
    sc.onerror = () => finish({s:"fail"});
    sc.async = true;
    sc.src = "https://api.deezer.com/search?q=" + encodeURIComponent(dzQuery(it)) + "&limit=1&output=jsonp&callback=" + cb;
    document.head.appendChild(sc);
  });
}
function dzOff(){
  dz.off = true; dz.want = null;
  document.body.classList.add("dz-off");
  syncPlay();
}
// every play button: full track when there's an official upload, otherwise the 30s preview
function playTrack(key){
  const it = RELEASED.get(key); if(!it) return;
  if(fp.key === key || hasFull(it)){ playFull(key, it); return; }
  playPreview(key);
}
async function playPreview(key){
  if(dz.off) return;
  const it = RELEASED.get(key); if(!it) return;
  if(dz.cur === key){ stopAudio(); return; }
  let c = dz.cache.get(key);
  if(c && c.s === "busy"){ dz.want = key; return; }
  dz.want = key;
  if(!c){
    dz.cache.set(key, {s:"busy"}); syncPlay();
    c = await dzLookup(it);
    if(c.s === "fail"){ dz.cache.delete(key); dzOff(); return; }
    dz.cache.set(key, c);
    if(dz.want !== key){ syncPlay(); return; } // something else was tapped meanwhile
  }
  if(c.s !== "ok"){ syncPlay(); return; }
  startAudio(key, it, c.url);
}
function startAudio(key, it, url){
  clearTimeout(dz.endT);

  showNp(it);

  if(p && p.catch) p.catch(err => {
    if(dz.cur !== key) return;
    const n = err && err.name;

}
function stopAudio(){
  clearTimeout(dz.endT);
